[mypy]
python_version = 3.9
strict = True
warn_unused_configs = True
# Only report errors in the package being checked. Other libraries still provide their types.
follow_imports = silent
mypy_path = $MYPY_CONFIG_FILE_DIR
exclude = /_vendored/
# Modules that have not been annotated yet (see the ignore_errors section below).
untyped_calls_exclude = webkitcorepy,webkitcorepy.arguments,webkitcorepy.autoinstall,webkitcorepy.config,webkitcorepy.credentials,webkitcorepy.editor,webkitcorepy.environment,webkitcorepy.file_lock,webkitcorepy.log_config,webkitcorepy.measure_time,webkitcorepy.mocks.context_stack,webkitcorepy.mocks.environment,webkitcorepy.mocks.file_lock,webkitcorepy.mocks.popen,webkitcorepy.mocks.requests_,webkitcorepy.mocks.subprocess,webkitcorepy.mocks.terminal,webkitcorepy.mocks.time_,webkitcorepy.nested_fuzzy_dict,webkitcorepy.output_capture,webkitcorepy.partial_proxy,webkitcorepy.skill_testing,webkitcorepy.skill_testing.skill_file,webkitcorepy.skill_testing.skill_test,webkitcorepy.skill_testing.validators,webkitcorepy.subprocess_utils,webkitcorepy.task_pool,webkitcorepy.terminal,webkitcorepy.testing,webkitcorepy.testing.llm_test_runner,webkitcorepy.testing.path_test_case,webkitcorepy.testing.python_test_runner,webkitcorepy.testing.test_runner,webkitcorepy.timeout,webkitcorepy.timer

# Tests are checked with mypy's defaults, so unannotated tests aren't checked at all.
[mypy-webkitcorepy.tests.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_calls = False
disallow_untyped_decorators = False
check_untyped_defs = False
warn_return_any = False
disallow_any_generics = False
disallow_subclassing_any = False
implicit_reexport = True

[mypy-webkitcorepy.mocks.*]
warn_return_any = False
disallow_any_generics = False
disallow_subclassing_any = False

[mypy-mypy.*]
follow_imports = skip

[mypy-webkitpy.*]
follow_imports = skip
ignore_missing_imports = True

[mypy-jsone.*,tblib.*]
ignore_missing_imports = True

# These packages' types come from separate stub distributions, which AutoInstall doesn't
# install. Treat them as untyped everywhere, even where their stubs happen to be installed.
[mypy-requests.*,six.*,urllib3.*,yaml.*]
follow_imports = skip
follow_imports_for_stubs = True
ignore_missing_imports = True

# Modules that have not been annotated yet. Remove modules from this list, and from
# untyped_calls_exclude above, as they're annotated.
[mypy-webkitcorepy,webkitcorepy.arguments,webkitcorepy.autoinstall,webkitcorepy.config,webkitcorepy.credentials,webkitcorepy.editor,webkitcorepy.environment,webkitcorepy.file_lock,webkitcorepy.log_config,webkitcorepy.measure_time,webkitcorepy.mocks.context_stack,webkitcorepy.mocks.environment,webkitcorepy.mocks.file_lock,webkitcorepy.mocks.popen,webkitcorepy.mocks.requests_,webkitcorepy.mocks.subprocess,webkitcorepy.mocks.terminal,webkitcorepy.mocks.time_,webkitcorepy.nested_fuzzy_dict,webkitcorepy.output_capture,webkitcorepy.partial_proxy,webkitcorepy.skill_testing,webkitcorepy.skill_testing.skill_file,webkitcorepy.skill_testing.skill_test,webkitcorepy.skill_testing.validators,webkitcorepy.subprocess_utils,webkitcorepy.task_pool,webkitcorepy.terminal,webkitcorepy.testing,webkitcorepy.testing.llm_test_runner,webkitcorepy.testing.path_test_case,webkitcorepy.testing.python_test_runner,webkitcorepy.testing.test_runner,webkitcorepy.timeout,webkitcorepy.timer]
ignore_errors = True
