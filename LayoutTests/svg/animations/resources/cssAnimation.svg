<svg width="200" height="100" xmlns="http://www.w3.org/2000/svg">
    <style>
        @keyframes move {
            0% { transform: translateX(0); }
            100% { transform: translateX(100px); }
        }
        rect {
            animation: move 1s linear infinite;
        }
    </style>
    <rect width="100" height="100" fill="green"/>
</svg>
