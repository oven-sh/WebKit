<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
</head>
<body>
<p>Cross-origin frame that owns its own IndexedDB database.</p>
<script>
const databaseName = "SiteIsolationFrameDatabase";

function requestToPromise(request) {
    return new Promise((resolve, reject) => {
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
    });
}

// Rebuilt on every load because the data store outlives a single test.
async function recreateDatabase() {
    await requestToPromise(indexedDB.deleteDatabase(databaseName));

    let request = indexedDB.open(databaseName, 1);
    request.onupgradeneeded = () => {
        let database = request.result;

        let reviewers = database.createObjectStore("Reviewers", {autoIncrement: true});
        reviewers.createIndex("Name Index", "name", {unique: false});
        reviewers.createIndex("Email Index", "email", {unique: true});
        reviewers.add({name: "Thirsty Hamster", email: "hamster@webkit.org"});
        reviewers.add({name: "Jamming Peacock", email: "peacock@webkit.org"});
        reviewers.add({name: "Bustling Badger", email: "badger@webkit.org"});
        reviewers.add({name: "Monstrous Beaver", email: "beaver@webkit.org"});

        database.createObjectStore("Empty");
    };

    let database = await requestToPromise(request);
    database.close();
}

async function countRecords(objectStoreName) {
    let database = await requestToPromise(indexedDB.open(databaseName));
    let count = await requestToPromise(database.transaction(objectStoreName).objectStore(objectStoreName).count());
    database.close();
    return count;
}

recreateDatabase().then(() => {
    parent.postMessage("indexeddb-frame-ready", "*");
});
</script>
</body>
</html>
