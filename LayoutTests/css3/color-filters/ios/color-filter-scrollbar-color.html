<!-- webkit-test-runner [ MockScrollbarsEnabled=false AsyncOverflowScrollingEnabled=true ColorFilterEnabled=true ] -->
<!DOCTYPE html>

<title>-apple-color-filter is applied to scrollbar color (iOS version)</title>

<script src="../../../resources/ui-helper.js"></script>

<style>
  :root {
    -apple-color-filter: invert(1);
    scrollbar-color: blue green;
  }

  .tall {
    width: 100px;
    height: 2000px;
  }
</style>

<p id="result"></p>
<div class="tall"></div>

<script>
  onload = async () => {
    if (window.testRunner) {
      testRunner.dumpAsText();
      testRunner.waitUntilDone();
    }

    if (window.internals)
      internals.setUsesOverlayScrollbars(true);

    // Wait for the initial scroller.
    await UIHelper.waitForConditionAsync(async () => {
      let scrollerState = await UIHelper.verticalScrollbarState();

      let correctThumbColor = scrollerState.indexOf("#FFFF00") != -1;
      // iOS doesn't set track color.

      return correctThumbColor;
    });

    // FIXME: there's a bug on iOS where scrollbar color isn't updated
    // when scrollbar-color changes.

    result.innerText = "PASS";
    if (window.testRunner)
      testRunner.notifyDone();
  };
</script>
