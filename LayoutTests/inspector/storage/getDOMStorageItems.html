<!DOCTYPE html>
<html>
<head>
<script src="../../http/tests/inspector/resources/inspector-test.js"></script>
<script src="resources/storage-utilities.js"></script>
<script>
function test()
{
    let suite = InspectorTest.createAsyncSuite("DOMStorage.getDOMStorageItems");

    async function checkEmptyEntries(storage)
    {
        let storageName = storage.isLocalStorage() ? "localStorage" : "sessionStorage";
        await InspectorTest.evaluateInPage(`${storageName}.setItem("empty-value", ""); ${storageName}.setItem("", "empty-key");`);

        let freshStorage = new WI.DOMStorageObject(storage.id, storage.host, storage.isLocalStorage());
        let [error] = await promisify((callback) => { freshStorage.getEntries(callback); });
        InspectorTest.assert(!error, error);

        InspectorTest.expectTrue(freshStorage.entries.has("empty-value"), "An empty-valued key should be cached for duplicate checks.");
        InspectorTest.expectEqual(freshStorage.entries.get("empty-value"), "", "An empty value should be preserved.");
        InspectorTest.expectTrue(freshStorage.entries.has(""), "An empty key should be cached.");
        InspectorTest.expectEqual(freshStorage.entries.get(""), "empty-key", "The value for an empty key should be preserved.");
    }

    suite.addTestCase({
        name: "DOMStorage.getDOMStorageItems.Session",
        description: "Test that DOMStorage.getDOMStorageItems works with Session storage.",
        async test() {
            let sessionStorage = WI.domStorageManager.domStorageObjects.find((x) => !x.isLocalStorage());
            InspectorTest.expectThat(sessionStorage, "Should have a DOMStorageObject for sessionStorage.");

            await InspectorTest.Storage.logEntries(sessionStorage);
            await checkEmptyEntries(sessionStorage);
        },
    });

    suite.addTestCase({
        name: "DOMStorage.getDOMStorageItems.Local",
        description: "Test that DOMStorage.getDOMStorageItems works with Local storage.",
        async test() {
            let localStorage = WI.domStorageManager.domStorageObjects.find((x) => x.isLocalStorage());
            InspectorTest.expectThat(localStorage, "Should have a DOMStorageObject for localStorage.");

            await InspectorTest.Storage.logEntries(localStorage);
            await checkEmptyEntries(localStorage);
        },
    });

    InspectorTest.evaluateInPage("clearStorages()", () => {
        suite.runTestCasesAndFinish();
    });
}
</script>
</head>
<body onload="runTest()">
<p>Tests for DOMStorage.getDOMStorageItems.</p>
</body>
</html>
