<div id="description"></div>
<div id="console"></div>
<script>
description("Tests that the queries involving the default framebuffer of an OffscreenCanvas WebGL context in a worker give the same answers in every state of the context. Part 2 of 4.");

jsTestIsAsync = true;

if (window.internals)
    internals.settings.setWebGLErrorsToConsoleEnabled(false);

</script>
