<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>WebGL default framebuffer size limits in a worker, part 2 of 4</title>
<script src="../resources/js-test.js"></script>
</head>
<body>
<div id="description"></div>
<div id="console"></div>
<script>
description("Tests that an OffscreenCanvas in a worker resized larger than the implementation limits gets a drawing buffer clamped to the limits, without errors or a context loss, and that the clamped drawing buffer renders and is read with the clamped size. Part 2 of 4.");

jsTestIsAsync = true;
startBufferingOutput();
// Workers do not have internals.settings. The worker gets the settings of the page when it starts.
if (window.internals)
    internals.settings.setWebGLErrorsToConsoleEnabled(false);
startWorker("resources/default-framebuffer-size-limits-worker.js#2-4");
</script>
</body>
</html>
