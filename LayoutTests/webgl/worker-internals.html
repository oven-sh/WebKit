<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>The internals object in dedicated and shared workers</title>
<script src="../resources/js-test.js"></script>
</head>
<body>
<div id="description"></div>
<div id="console"></div>
<script>
description("Tests that dedicated and shared workers have the internals object with the WebGL functions when their script starts.");

jsTestIsAsync = true;
var state;

function checkState(workerType, workerState, checkWebGLContext)
{
    debug("");
    debug(workerType);
    state = workerState;
    shouldBeEqualToString("state.internals", "object");
    shouldBeEqualToString("state.settings", "undefined");
    shouldBeEqualToString("state.simulateEventForWebGLContext", "function");
    shouldBeEqualToString("state.webglMaxDrawingBufferSize", "function");
    shouldBeEqualToString("state.requestedGPU", "function");
    if (!checkWebGLContext)
        return;
    shouldBeEqualToString("state.webglMaxDrawingBufferSizeResult", "valid");
    shouldBeEqualToString("state.requestedGPUResult", "default");
}

var worker = new Worker("resources/worker-internals-worker.js");
worker.onmessage = function(event)
{
    checkState("Dedicated worker", event.data, true);
    var sharedWorker = new SharedWorker("resources/worker-internals-worker.js");
    sharedWorker.port.onmessage = function(event)
    {
        // Shared workers do not create WebGL contexts.
        checkState("Shared worker", event.data, false);
        finishJSTest();
    };
};
</script>
</body>
</html>
