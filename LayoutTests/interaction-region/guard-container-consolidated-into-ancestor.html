<!DOCTYPE html>
<html>
<style>
    body { margin: 0; }

    .container {
        position: absolute;
        top: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        border-radius: 100%;
        background-color: #add8ff;
        cursor: pointer;
    }
    .container.large {
        width: 160px;
        height: 160px;
    }
    #alpha-image { left: 20px; }
    #opaque-image { left: 96px; }
    #link { left: 172px; }
    #padded { left: 248px; }
    #not-consolidated { left: 400px; }
    #overflowing { left: 600px; }

    button, a {
        display: flex;
        padding: 0;
        border: 0;
        background: none;
        cursor: pointer;
    }
    img {
        width: 54px;
        height: 54px;
        border-radius: 50%;
    }
    #padded button {
        padding: 4px;
    }
    #padded img {
        width: 40px;
        height: 40px;
    }
    #overflowing button {
        padding: 20px;
    }
</style>
<body>
<!--
    A transparent button or link whose only child is an image is a guard container: it gets a Guard region
    that extends the image's region. When the image's region is consolidated into a clickable ancestor's
    region, the Guard has nothing left to extend and would block the ancestor's region, so it is removed.
    This also applies when the guard container is larger than the image, or extends beyond the ancestor.
    In "not-consolidated" the image is too far from the ancestor's edges: it keeps its region and the
    button keeps its Guard.
-->
<section id="test">
    <div id="alpha-image" class="container"><button><img src="resources/image.png"></button></div>
    <div id="opaque-image" class="container"><button><img src="resources/opaque-rgb.jpg"></button></div>
    <div id="link" class="container"><a href="#"><img src="resources/image.png"></a></div>
    <div id="padded" class="container"><button><img src="resources/image.png"></button></div>
    <div id="not-consolidated" class="container large"><button><img src="resources/opaque-rgb.jpg"></button></div>
    <div id="overflowing" class="container"><button><img src="resources/opaque-rgb.jpg"></button></div>
</section>

<pre id="results"></pre>
<script>
document.body.addEventListener("click", function(e) {
    console.log(e, "event delegation");
});

if (window.testRunner)
    testRunner.dumpAsText();

window.onload = function () {
    if (!window.internals)
        return;

    results.textContent = internals.layerTreeAsText(document, internals.LAYER_TREE_INCLUDES_EVENT_REGION | internals.LAYER_TREE_INCLUDES_ROOT_LAYER_PROPERTIES);
    document.getElementById("test").remove();
};
</script>
</body>
</html>
