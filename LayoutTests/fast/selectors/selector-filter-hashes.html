<!DOCTYPE html>
Test how many selector filter hashes in each category we extract from a selector.
<pre id=log></pre>
<script>
if (window.testRunner)
    testRunner.dumpAsText();

function write(text) {
    log.textContent += text + "\n";
}

function test(selector) {
    const counts = internals.selectorFilterHashCounts(selector);
    write(`${selector} (${counts.ids}, ${counts.classes}, ${counts.tags}, ${counts.attributes})`);
}

function run() {
    write("selector (ids, classes, tags, attributes)")

    test("#a");
    test(".a");
    test("a");
    test("[a]");
    test("[a=foo]");

    test("#a target");
    test(".a target");
    test("a target");
    test("[a] target");
    test("[a=foo] target");

    test("#a > target");
    test(".a > target");
    test("a > target");
    test("[a] > target");

    test("#a + target");
    test(".a + target");
    test("a + target");
    test("[a] + target");

    test("#a ~ target");
    test(".a ~ target");
    test("a ~ target");
    test("[a] ~ target");

    test("b#a target");
    test("b.a target");
    test("b[a] target");

    test("c[d].e b#a target");
    test("c[d].e b.a target");
    test("c[d].e b[a] target");

    test("c[d].e b#a + target");
    test("c[d].e b.a + target");
    test("c[d].e b[a] + target");

    test("c[d].e + b#a target");
    test("c[d].e + b.a target");
    test("c[d].e + b[a] target");

    test("c[d].e b#a ~ target");
    test("c[d].e b.a ~ target");
    test("c[d].e b[a] ~ target");

    test(":not(a)");
    test(":not(a) target");
    test(":not(a, .b) target");

    test(":has(a)");
    test(":has(a) target");
    test(":has(a, .b) target");

    test(":is(a)");
    test(":is(a) target");
    test(":is(a, .b) target");
    test(":is(a .b) target");
    test(":is(a + .b) target");
    test(":is(a .b) + target");
    test("#c :is(a, .b) target");
    test("#c :is(a .b) target");

    // [class~=foo] is equivalent to .foo, so it contributes a class hash rather than
    // a much less selective "has a class attribute" hash. The forms that are not
    // equivalent keep contributing an attribute hash.
    test("[class~=foo] target");
    test("[class~=foo s] target");
    test("[class~=foo i] target");
    test("[class~='foo bar'] target");
    test("[class~=''] target");
    test("[CLASS~=foo] target");
    test("[*|class~=foo] target");
    test("[className~=foo] target");
};

if (window.internals)
    run();
else
    write("This test requires Window.internals");
</script>
