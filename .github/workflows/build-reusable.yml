name: Build WebKit (Reusable)

env:
  LLVM_VERSION: 21

on:
  workflow_call:
    inputs:
      build_ref:
        description: 'Git ref to build (commit SHA, branch, or tag)'
        type: string
        required: true
      release_tag:
        description: 'Full release tag (including autobuild- prefix)'
        type: string
        required: true
      is_prerelease:
        description: 'Mark release as prerelease'
        type: boolean
        default: false
      llvm_version:
        description: 'LLVM version to use'
        type: string
        default: '19'
    outputs:
      release_tag:
        description: 'The release tag that was created'
        value: ${{ jobs.release.outputs.tag }}

jobs:
  linux:
    name: Linux
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        include:
          - lto_flag: ""
            label: bun-webkit-linux-amd64-debug
            os: linux-x64-gh
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "Debug"
            RELEASE_FLAGS: "-O3 -DNDEBUG=1"
          - lto_flag: ""
            label: bun-webkit-linux-arm64-debug
            os: linux-arm64-gh
            package_json_arch: "arm64"
            CMAKE_BUILD_TYPE: "Debug"
            RELEASE_FLAGS: "-O3 -DNDEBUG=1"
          - lto_flag: ""
            label: bun-webkit-linux-arm64-debug-asan
            os: linux-arm64-gh
            package_json_arch: "arm64"
            CMAKE_BUILD_TYPE: "Debug"
            RELEASE_FLAGS: "-O3 -DNDEBUG=1"
            ENABLE_SANITIZERS: "address,undefined"
          - lto_flag: ""
            label: bun-webkit-linux-amd64-debug-asan
            os: linux-x64-gh
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "Debug"
            RELEASE_FLAGS: "-O3 -DNDEBUG=1"
            ENABLE_SANITIZERS: "address,undefined"
          - lto_flag: "-flto=full -fwhole-program-vtables -fforce-emit-vtables"
            label: bun-webkit-linux-arm64-lto
            os: linux-arm64-gh
            package_json_arch: "arm64"
            CMAKE_BUILD_TYPE: "Release"
            RELEASE_FLAGS: "-O3 -DNDEBUG=1"
          - lto_flag: ""
            label: bun-webkit-linux-arm64
            os: linux-arm64-gh
            package_json_arch: "arm64"
            CMAKE_BUILD_TYPE: "Release"
            RELEASE_FLAGS: "-O3 -DNDEBUG=1"
          - lto_flag: "-flto=full -fwhole-program-vtables -fforce-emit-vtables"
            label: bun-webkit-linux-amd64-lto
            os: linux-x64-gh
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "Release"
            RELEASE_FLAGS: "-O3 -DNDEBUG=1"
          - lto_flag: ""
            label: bun-webkit-linux-amd64
            os: linux-x64-gh
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "Release"
            RELEASE_FLAGS: "-O3 -DNDEBUG=1"
          - lto_flag: "-flto=full -fwhole-program-vtables -fforce-emit-vtables"
            label: bun-webkit-linux-amd64-baseline-lto
            os: linux-x64-gh
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "Release"
            RELEASE_FLAGS: "-O3 -DNDEBUG=1"
            MARCH_FLAG: "-march=nehalem"
          - lto_flag: ""
            label: bun-webkit-linux-amd64-baseline
            os: linux-x64-gh
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "Release"
            RELEASE_FLAGS: "-O3 -DNDEBUG=1"
            MARCH_FLAG: "-march=nehalem"
          - lto_flag: ""
            label: bun-webkit-linux-amd64-asan
            os: linux-x64-gh
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "Release"
            RELEASE_FLAGS: "-O3 -DNDEBUG=1"
            ENABLE_SANITIZERS: "address,undefined"
          - lto_flag: ""
            label: bun-webkit-linux-arm64-asan
            os: linux-arm64-gh
            package_json_arch: "arm64"
            CMAKE_BUILD_TYPE: "Release"
            RELEASE_FLAGS: "-O3 -DNDEBUG=1"
            ENABLE_SANITIZERS: "address,undefined"
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.build_ref }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !LayoutTests/
            !JSTests/
      - uses: docker/setup-buildx-action@885d1462b80bc1c1c7f0b00334ad271f09369c55 # v2.10.0
        id: buildx
        with:
          install: true
      - name: Run
        env:
          RELEASE_FLAGS: ${{matrix.RELEASE_FLAGS}}
          ENABLE_SANITIZERS: ${{matrix.ENABLE_SANITIZERS}}
        run: |
          rm -rf ${{runner.temp}}/bun-webkit ${{runner.temp}}/bun-webkit.tar.gz
          if [ "${{matrix.package_json_arch}}" = "arm64" ]; then
            export MARCH_FLAG="-march=armv8-a+crc -mtune=ampere1"
          else
            export MARCH_FLAG="${{ matrix.MARCH_FLAG || '-march=haswell' }}"
          fi
          WEBKIT_RELEASE_TYPE=${{matrix.CMAKE_BUILD_TYPE}} CPU="native" cpu=native LTO_FLAG="${{matrix.lto_flag}}" temp=${{runner.temp}} ENABLE_SANITIZERS="${{matrix.ENABLE_SANITIZERS}}" bash release.sh
          cd ${{runner.temp}}
          echo "#define BUN_WEBKIT_VERSION \"${{ inputs.build_ref }}\"" >> bun-webkit/include/cmakeconfig.h
          echo '{ "name": "${{matrix.label}}", "version": "0.0.1-${{ inputs.build_ref }}", "os": ["linux"], "cpu": ["${{matrix.package_json_arch}}"], "repository": "https://github.com/${{github.repository}}" }' > bun-webkit/package.json
          rm -rf bun-webkit/lib/*.so
          rm -rf bun-webkit/lib/*.so.*
          tar -czf bun-webkit.tar.gz bun-webkit
          rm -rf bun-webkit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{matrix.label}}
          path: ${{runner.temp}}/bun-webkit.tar.gz

  windows-cross:
    name: Windows (cross-compiled from Linux)
    # Cross-compiled from a Linux host: clang-cl --target + an xwin-downloaded
    # MSVC CRT/Windows SDK + lld-link (see Dockerfile.windows). Replaces the
    # native Windows runner job (except arm64-debug — see the `windows` job
    # below) and adds the -lto variants it never built. windows-release.ps1
    # remains for building on a real Windows machine.
    runs-on: linux-x64-gh
    strategy:
      # One variant's failure shouldn't cancel the others.
      fail-fast: false
      matrix:
        include:
          - label: bun-webkit-windows-amd64
            win_arch: x64
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "Release"
            lto_flag: ""
          - label: bun-webkit-windows-amd64-lto
            win_arch: x64
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "Release"
            # ThinLTO like the macOS -lto variants: the bitcode carries ThinLTO
            # summaries so the consumer's link gets parallel backends + cross
            # -language importing instead of one giant serial full-LTO module.
            # -fno-split-lto-unit keeps every module a pure summary module
            # (consistent with rustc's bitcode, which never splits).
            # Unlike linux/macos there is no -fwhole-program-vtables
            # -fforce-emit-vtables here: WPD drops vtable symbols that COFF
            # associative COMDAT sections still name as their parent and the
            # LTO codegen aborts ("Associative COMDAT symbol '??_7...' does
            # not exist").
            lto_flag: "/clang:-flto=thin /clang:-fno-split-lto-unit"
          - label: bun-webkit-windows-amd64-debug
            win_arch: x64
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "Debug"
            lto_flag: ""
          - label: bun-webkit-windows-amd64-baseline
            win_arch: x64
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "Release"
            lto_flag: ""
            baseline: "true"
          - label: bun-webkit-windows-amd64-baseline-lto
            win_arch: x64
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "Release"
            # Same ThinLTO configuration as bun-webkit-windows-amd64-lto above
            # (see that entry's comment), compiled for the nehalem baseline so
            # bun's windows-x64-baseline release links can do cross-language
            # LTO too — matching bun-webkit-linux-amd64-baseline-lto.
            lto_flag: "/clang:-flto=thin /clang:-fno-split-lto-unit"
            baseline: "true"
          # ASAN is x64-only: LLVM ships no Windows ARM64 ASAN runtime. The
          # sanitizer runtime (import lib, /MT runtime thunk, DLL) comes from
          # the compiler-rt-windows-* release tag (see Dockerfile.windows).
          - label: bun-webkit-windows-amd64-asan
            win_arch: x64
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "Release"
            lto_flag: ""
            ENABLE_SANITIZERS: "address,undefined"
          - label: bun-webkit-windows-arm64
            win_arch: arm64
            package_json_arch: "arm64"
            CMAKE_BUILD_TYPE: "Release"
            lto_flag: ""
          # No arm64-lto variant: LLVM 21's CodeView emitter has no register
          # mapping for ARM64 NEON quad-register tuples ("LLVM ERROR: unknown
          # codeview register Q22_Q23_Q24_Q25") and the LTO codegen allocates
          # values into them. Re-add once that's fixed upstream.
          # arm64-debug stays on the native Windows runner: /MTd needs the
          # ARM64 *debug* CRT (libcmtd.lib), which xwin's splat doesn't
          # produce (no CRT.arm64.Debug package in the VS manifest mapping).
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.build_ref }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !LayoutTests/
            !JSTests/
      - uses: docker/setup-buildx-action@885d1462b80bc1c1c7f0b00334ad271f09369c55 # v2.10.0
        id: buildx
        with:
          install: true
      - name: Run
        run: |
          rm -rf ${{runner.temp}}/bun-webkit ${{runner.temp}}/bun-webkit.tar.gz
          WIN_ARCH="${{matrix.win_arch}}" WEBKIT_RELEASE_TYPE="${{matrix.CMAKE_BUILD_TYPE}}" LTO_FLAG="${{matrix.lto_flag}}" BASELINE="${{matrix.baseline}}" ENABLE_SANITIZERS="${{matrix.ENABLE_SANITIZERS}}" temp=${{runner.temp}} bash windows-cross-release.sh
          cd ${{runner.temp}}
          echo "#define BUN_WEBKIT_VERSION \"${{ inputs.build_ref }}\"" >> bun-webkit/include/cmakeconfig.h
          echo '{ "name": "${{matrix.label}}", "version": "0.0.1-${{ inputs.build_ref }}", "os": ["windows"], "cpu": ["${{matrix.package_json_arch}}"], "repository": "https://github.com/${{github.repository}}" }' > bun-webkit/package.json
          tar -czf bun-webkit.tar.gz bun-webkit
          rm -rf bun-webkit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{matrix.label}}
          path: ${{runner.temp}}/bun-webkit.tar.gz

  windows:
    name: Windows
    # Only arm64-debug still builds on a native Windows runner: the /MTd
    # debug CRT for ARM64 (libcmtd.lib) isn't available via xwin, so it
    # can't be cross-compiled from Linux yet. Everything else moved to the
    # `windows-cross` job above.
    strategy:
      matrix:
        include:
          - runner: windows-11-arm
            build-type: Debug
            package_json_arch: "arm64"
            label: bun-webkit-windows-arm64-debug
            platform: ARM64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Install Scoop
        run: |
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser
          Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
          Join-Path (Resolve-Path ~).Path "scoop\shims" >> $Env:GITHUB_PATH
      - name: Install LLVM and Ninja (ARM64)
        if: matrix.platform == 'ARM64'
        run: |
          "C:\Program Files\7-Zip" >> $Env:GITHUB_PATH
          scoop config use_external_7zip true
          scoop install ninja
          # Install LLVM ARM64 from official LLVM releases
          # Use LLVM 21 for ARM64 - has better Windows ARM64 support and fixes SEH unwind bugs
          $llvmVersion = "21.1.8"
          $llvmUrl = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$llvmVersion/LLVM-$llvmVersion-woa64.exe"
          $llvmPath = "C:\LLVM"
          Invoke-WebRequest -Uri $llvmUrl -OutFile "$env:TEMP\llvm-arm64.exe"
          & "C:\Program Files\7-Zip\7z.exe" x "$env:TEMP\llvm-arm64.exe" -o"$llvmPath" -y
          "$llvmPath\bin" >> $Env:GITHUB_PATH
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.build_ref }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !LayoutTests/
            !JSTests/
      - name: Build WebKit
        run: |
          if ("${{matrix.platform}}" -eq "ARM64") {
            $env:Path = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\arm64\;" + $env:Path
          } else {
            $env:Path = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\;" + $env:Path
          }
          $env:WEBKIT_OUTPUT_DIR = "bun-webkit"
          $env:BUN_WEBKIT_VERSION = "${{ inputs.build_ref }}"
          $env:CMAKE_BUILD_TYPE = "${{matrix.build-type}}"
          $env:PACKAGE_JSON_LABEL = "${{matrix.label}}"
          $env:GITHUB_SHA = "${{ inputs.build_ref }}"
          $env:PACKAGE_JSON_ARCH = "${{matrix.package_json_arch}}"
          $env:GITHUB_REPOSITORY = "${{ github.repository }}"
          $Baseline = "${{ matrix.baseline }}" -eq "true"
          ./windows-release.ps1 -Platform ${{matrix.platform}} -Baseline:$Baseline
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{matrix.label}}
          path: bun-webkit.tar.gz

  linux-musl:
    name: Linux musl
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        include:
          - lto_flag: ""
            label: bun-webkit-linux-amd64-musl-debug
            os: linux-x64-gh
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "Debug"
          - lto_flag: ""
            label: bun-webkit-linux-arm64-musl-debug
            os: linux-arm64-gh
            package_json_arch: "arm64"
            CMAKE_BUILD_TYPE: "Debug"
          - lto_flag: "-flto=full -fwhole-program-vtables -fforce-emit-vtables"
            label: bun-webkit-linux-arm64-musl-lto
            os: linux-arm64-gh
            package_json_arch: "arm64"
            CMAKE_BUILD_TYPE: "MinSizeRel"
          - lto_flag: ""
            label: bun-webkit-linux-arm64-musl
            os: linux-arm64-gh
            package_json_arch: "arm64"
            CMAKE_BUILD_TYPE: "MinSizeRel"
          - lto_flag: "-flto=full -fwhole-program-vtables -fforce-emit-vtables"
            label: bun-webkit-linux-amd64-musl-lto
            os: linux-x64-gh
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "MinSizeRel"
          - lto_flag: ""
            label: bun-webkit-linux-amd64-musl
            os: linux-x64-gh
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "MinSizeRel"
          - lto_flag: "-flto=full -fwhole-program-vtables -fforce-emit-vtables"
            label: bun-webkit-linux-amd64-musl-baseline-lto
            os: linux-x64-gh
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "MinSizeRel"
            MARCH_FLAG: "-march=nehalem"
          - lto_flag: ""
            label: bun-webkit-linux-amd64-musl-baseline
            os: linux-x64-gh
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "MinSizeRel"
            MARCH_FLAG: "-march=nehalem"
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.build_ref }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !LayoutTests/
            !JSTests/
      - uses: docker/setup-buildx-action@885d1462b80bc1c1c7f0b00334ad271f09369c55 # v2.10.0
        id: buildx
        with:
          install: true
      - name: Run
        run: |
          rm -rf ${{runner.temp}}/bun-webkit ${{runner.temp}}/bun-webkit.tar.gz
          if [ "${{matrix.package_json_arch}}" = "arm64" ]; then
            export MARCH_FLAG="-march=armv8-a+crc -mtune=ampere1"
          else
            export MARCH_FLAG="${{ matrix.MARCH_FLAG || '-march=haswell' }}"
          fi
          WEBKIT_RELEASE_TYPE=${{matrix.CMAKE_BUILD_TYPE}} CPU="native" cpu=native LTO_FLAG="${{matrix.lto_flag}}" temp=${{runner.temp}} bash musl-release.sh
          cd ${{runner.temp}}
          echo "#define BUN_WEBKIT_VERSION \"${{ inputs.build_ref }}\"" >> bun-webkit/include/cmakeconfig.h
          echo '{ "name": "${{matrix.label}}", "version": "0.0.1-${{ inputs.build_ref }}", "os": ["linux"], "cpu": ["${{matrix.package_json_arch}}"], "repository": "https://github.com/${{github.repository}}" }' > bun-webkit/package.json
          rm -rf bun-webkit/lib/*.so
          rm -rf bun-webkit/lib/*.so.*
          tar -czf bun-webkit.tar.gz bun-webkit
          rm -rf bun-webkit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{matrix.label}}
          path: ${{runner.temp}}/bun-webkit.tar.gz

  macos-cross:
    name: macOS (cross-compiled from Linux)
    # Cross-compiled from a Linux host via clang --target + a pinned macOS SDK,
    # linked with ld64.lld (see Dockerfile.macos). Replaces the native macOS
    # runner job entirely and adds the -lto variants it never built. The ASAN
    # variants link against the darwin sanitizer runtime mirrored at the
    # compiler-rt-darwin-* release tag (a Linux LLVM install doesn't ship it).
    # mac-release.bash remains for building on a real Mac locally.
    runs-on: linux-x64-gh
    strategy:
      matrix:
        include:
          - label: bun-webkit-macos-arm64
            macos_arch: arm64
            package_json_arch: "arm64"
            CMAKE_BUILD_TYPE: "Release"
            lto_flag: ""
          - label: bun-webkit-macos-arm64-lto
            macos_arch: arm64
            package_json_arch: "arm64"
            CMAKE_BUILD_TYPE: "Release"
            lto_flag: "-flto=thin -fno-split-lto-unit -fwhole-program-vtables -fforce-emit-vtables"
          - label: bun-webkit-macos-arm64-debug
            macos_arch: arm64
            package_json_arch: "arm64"
            CMAKE_BUILD_TYPE: "Debug"
            lto_flag: ""
            cpp_flags: "-D_LIBCXX_ENABLE_ASSERTIONS=1"
          - label: bun-webkit-macos-amd64
            macos_arch: x86_64
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "Release"
            lto_flag: ""
          - label: bun-webkit-macos-amd64-lto
            macos_arch: x86_64
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "Release"
            lto_flag: "-flto=thin -fno-split-lto-unit -fwhole-program-vtables -fforce-emit-vtables"
          - label: bun-webkit-macos-amd64-debug
            macos_arch: x86_64
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "Debug"
            lto_flag: ""
            cpp_flags: "-D_LIBCXX_ENABLE_ASSERTIONS=1"
          # ASAN: arm64 only — the mirrored darwin sanitizer runtime
          # (compiler-rt-darwin release tag) is extracted from the official
          # LLVM macOS release, which is published for arm64 only.
          - label: bun-webkit-macos-arm64-asan
            macos_arch: arm64
            package_json_arch: "arm64"
            CMAKE_BUILD_TYPE: "Release"
            lto_flag: ""
            cpp_flags: "-D_LIBCXX_ENABLE_ASSERTIONS=1"
            ENABLE_SANITIZERS: "address,undefined"
          - label: bun-webkit-macos-arm64-debug-asan
            macos_arch: arm64
            package_json_arch: "arm64"
            CMAKE_BUILD_TYPE: "Debug"
            lto_flag: ""
            cpp_flags: "-D_LIBCXX_ENABLE_ASSERTIONS=1"
            ENABLE_SANITIZERS: "address,undefined"
            ENABLE_MALLOC_HEAP_BREAKDOWN: "OFF"
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.build_ref }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !LayoutTests/
            !JSTests/
      - uses: docker/setup-buildx-action@885d1462b80bc1c1c7f0b00334ad271f09369c55 # v2.10.0
        id: buildx
        with:
          install: true
      - name: Run
        run: |
          rm -rf ${{runner.temp}}/bun-webkit ${{runner.temp}}/bun-webkit.tar.gz
          MACOS_ARCH="${{matrix.macos_arch}}" WEBKIT_RELEASE_TYPE="${{matrix.CMAKE_BUILD_TYPE}}" LTO_FLAG="${{matrix.lto_flag}}" CPP_FLAGS="${{matrix.cpp_flags}}" ENABLE_SANITIZERS="${{matrix.ENABLE_SANITIZERS}}" ENABLE_MALLOC_HEAP_BREAKDOWN="${{matrix.ENABLE_MALLOC_HEAP_BREAKDOWN}}" temp=${{runner.temp}} bash macos-cross-release.sh
          cd ${{runner.temp}}
          echo "#define BUN_WEBKIT_VERSION \"${{ inputs.build_ref }}\"" >> bun-webkit/include/cmakeconfig.h
          echo '{ "name": "${{matrix.label}}", "version": "0.0.1-${{ inputs.build_ref }}", "os": ["darwin"], "cpu": ["${{matrix.package_json_arch}}"], "repository": "https://github.com/${{github.repository}}" }' > bun-webkit/package.json
          tar -czf bun-webkit.tar.gz bun-webkit
          rm -rf bun-webkit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{matrix.label}}
          path: ${{runner.temp}}/bun-webkit.tar.gz

  freebsd:
    name: FreeBSD
    # Cross-compiled from a Linux host via clang --target + base.txz sysroot,
    # so all FreeBSD targets build on x64 regardless of target arch.
    runs-on: linux-x64-gh
    strategy:
      matrix:
        include:
          - label: bun-webkit-freebsd-amd64
            freebsd_arch: x86_64
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "Release"
          - label: bun-webkit-freebsd-amd64-debug
            freebsd_arch: x86_64
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "Debug"
          - label: bun-webkit-freebsd-arm64
            freebsd_arch: aarch64
            package_json_arch: "arm64"
            CMAKE_BUILD_TYPE: "Release"
          - label: bun-webkit-freebsd-arm64-debug
            freebsd_arch: aarch64
            package_json_arch: "arm64"
            CMAKE_BUILD_TYPE: "Debug"
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.build_ref }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !LayoutTests/
            !JSTests/
      - uses: docker/setup-buildx-action@885d1462b80bc1c1c7f0b00334ad271f09369c55 # v2.10.0
        id: buildx
        with:
          install: true
      - name: Run
        run: |
          rm -rf ${{runner.temp}}/bun-webkit ${{runner.temp}}/bun-webkit.tar.gz
          FREEBSD_ARCH="${{matrix.freebsd_arch}}" WEBKIT_RELEASE_TYPE="${{matrix.CMAKE_BUILD_TYPE}}" temp=${{runner.temp}} bash freebsd-release.sh
          cd ${{runner.temp}}
