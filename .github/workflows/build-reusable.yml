name: Build WebKit (Reusable)

env:
  LLVM_VERSION: 21

on:
  workflow_call:
    inputs:
      build_ref:
        description: 'Git ref to build (commit SHA, branch, or tag)'
        type: string
        required: true
      release_tag:
        description: 'Full release tag (including autobuild- prefix)'
        type: string
        required: true
      is_prerelease:
        description: 'Mark release as prerelease'
        type: boolean
        default: false
      llvm_version:
        description: 'LLVM version to use'
        type: string
        default: '19'
    outputs:
      release_tag:
        description: 'The release tag that was created'
        value: ${{ jobs.release.outputs.tag }}

jobs:
  linux:
    name: Linux
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        include:
          - lto_flag: ""
            label: bun-webkit-linux-amd64-debug
            os: linux-x64-gh
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "Debug"
            RELEASE_FLAGS: "-O3 -DNDEBUG=1"
          - lto_flag: ""
            label: bun-webkit-linux-arm64-debug
            os: linux-arm64-gh
            package_json_arch: "arm64"
            CMAKE_BUILD_TYPE: "Debug"
            RELEASE_FLAGS: "-O3 -DNDEBUG=1"
          - lto_flag: ""
            label: bun-webkit-linux-arm64-debug-asan
            os: linux-arm64-gh
            package_json_arch: "arm64"
            CMAKE_BUILD_TYPE: "Debug"
            RELEASE_FLAGS: "-O3 -DNDEBUG=1"
            ENABLE_SANITIZERS: "address,undefined"
          - lto_flag: ""
            label: bun-webkit-linux-amd64-debug-asan
            os: linux-x64-gh
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "Debug"
            RELEASE_FLAGS: "-O3 -DNDEBUG=1"
            ENABLE_SANITIZERS: "address,undefined"
          - lto_flag: "-flto=thin -fno-split-lto-unit -fwhole-program-vtables -fforce-emit-vtables"
            label: bun-webkit-linux-arm64-lto
            os: linux-arm64-gh
            package_json_arch: "arm64"
            CMAKE_BUILD_TYPE: "Release"
            RELEASE_FLAGS: "-O3 -DNDEBUG=1"
            USE_MIMALLOC: "ON"
            USE_EXTERNAL_MIMALLOC: "ON"
          - lto_flag: ""
            label: bun-webkit-linux-arm64
            os: linux-arm64-gh
            package_json_arch: "arm64"
            CMAKE_BUILD_TYPE: "Release"
            RELEASE_FLAGS: "-O3 -DNDEBUG=1"
            USE_MIMALLOC: "ON"
            USE_EXTERNAL_MIMALLOC: "ON"
          - lto_flag: "-flto=thin -fno-split-lto-unit -fwhole-program-vtables -fforce-emit-vtables"
            label: bun-webkit-linux-amd64-lto
            os: linux-x64-gh
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "Release"
            RELEASE_FLAGS: "-O3 -DNDEBUG=1"
            USE_MIMALLOC: "ON"
            USE_EXTERNAL_MIMALLOC: "ON"
          - lto_flag: ""
            label: bun-webkit-linux-amd64
            os: linux-x64-gh
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "Release"
            RELEASE_FLAGS: "-O3 -DNDEBUG=1"
            USE_MIMALLOC: "ON"
            USE_EXTERNAL_MIMALLOC: "ON"
          - lto_flag: ""
            label: bun-webkit-linux-amd64-asan
            os: linux-x64-gh
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "Release"
            RELEASE_FLAGS: "-O3 -DNDEBUG=1"
            ENABLE_SANITIZERS: "address,undefined"
          - lto_flag: ""
            label: bun-webkit-linux-arm64-asan
            os: linux-arm64-gh
            package_json_arch: "arm64"
            CMAKE_BUILD_TYPE: "Release"
            RELEASE_FLAGS: "-O3 -DNDEBUG=1"
            ENABLE_SANITIZERS: "address,undefined"
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.build_ref }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !LayoutTests/
            !JSTests/
      - uses: docker/setup-buildx-action@885d1462b80bc1c1c7f0b00334ad271f09369c55 # v2.10.0
        id: buildx
        with:
          install: true
      - name: Run
        env:
          RELEASE_FLAGS: ${{matrix.RELEASE_FLAGS}}
          ENABLE_SANITIZERS: ${{matrix.ENABLE_SANITIZERS}}
        run: |
          rm -rf ${{runner.temp}}/bun-webkit ${{runner.temp}}/bun-webkit.tar.gz
          if [ "${{matrix.package_json_arch}}" = "arm64" ]; then
            export MARCH_FLAG="-march=armv8-a+crc -mtune=ampere1"
          else
            export MARCH_FLAG="${{ matrix.MARCH_FLAG || '-march=nehalem' }}"
          fi
          WEBKIT_RELEASE_TYPE=${{matrix.CMAKE_BUILD_TYPE}} CPU="native" cpu=native LTO_FLAG="${{matrix.lto_flag}}" temp=${{runner.temp}} ENABLE_SANITIZERS="${{matrix.ENABLE_SANITIZERS}}" USE_MIMALLOC="${{matrix.USE_MIMALLOC || 'OFF'}}" USE_EXTERNAL_MIMALLOC="${{matrix.USE_EXTERNAL_MIMALLOC || 'OFF'}}" bash release.sh
          cd ${{runner.temp}}
          echo "#define BUN_WEBKIT_VERSION \"${{ inputs.build_ref }}\"" >> bun-webkit/include/cmakeconfig.h
          echo '{ "name": "${{matrix.label}}", "version": "0.0.1-${{ inputs.build_ref }}", "os": ["linux"], "cpu": ["${{matrix.package_json_arch}}"], "repository": "https://github.com/${{github.repository}}" }' > bun-webkit/package.json
          rm -rf bun-webkit/lib/*.so
          rm -rf bun-webkit/lib/*.so.*
          tar -czf bun-webkit.tar.gz bun-webkit
          rm -rf bun-webkit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{matrix.label}}
          path: ${{runner.temp}}/bun-webkit.tar.gz

  windows-cross:
    name: Windows (cross-compiled from Linux)
    # Cross-compiled from a Linux host: clang-cl --target + an xwin-downloaded
    # MSVC CRT/Windows SDK + lld-link (see Dockerfile.windows). Replaces the
    # native Windows runner job (except arm64-debug — see the `windows` job
    # below) and adds the -lto variants it never built. windows-release.ps1
    # remains for building on a real Windows machine.
    runs-on: linux-x64-gh
    strategy:
      # One variant's failure shouldn't cancel the others.
      fail-fast: false
      matrix:
        include:
          - label: bun-webkit-windows-amd64
            win_arch: x64
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "Release"
            lto_flag: ""
            USE_MIMALLOC: "ON"
            USE_EXTERNAL_MIMALLOC: "ON"
          - label: bun-webkit-windows-amd64-lto
            win_arch: x64
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "Release"
            # ThinLTO like the macOS -lto variants: the bitcode carries ThinLTO
            # summaries so the consumer's link gets parallel backends + cross
            # -language importing instead of one giant serial full-LTO module.
            # -fno-split-lto-unit keeps every module a pure summary module
            # (consistent with rustc's bitcode, which never splits).
            # Unlike linux/macos there is no -fwhole-program-vtables
            # -fforce-emit-vtables here: WPD drops vtable symbols that COFF
            # associative COMDAT sections still name as their parent and the
            # LTO codegen aborts ("Associative COMDAT symbol '??_7...' does
            # not exist").
            lto_flag: "/clang:-flto=thin /clang:-fno-split-lto-unit"
            USE_MIMALLOC: "ON"
            USE_EXTERNAL_MIMALLOC: "ON"
          - label: bun-webkit-windows-amd64-debug
            win_arch: x64
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "Debug"
            lto_flag: ""
          # ASAN is x64-only: LLVM ships no Windows ARM64 ASAN runtime. The
          # sanitizer runtime (import lib, /MT runtime thunk, DLL) comes from
          # the compiler-rt-windows-* release tag (see Dockerfile.windows).
          - label: bun-webkit-windows-amd64-asan
            win_arch: x64
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "Release"
            lto_flag: ""
            ENABLE_SANITIZERS: "address,undefined"
          - label: bun-webkit-windows-arm64
            win_arch: arm64
            package_json_arch: "arm64"
            CMAKE_BUILD_TYPE: "Release"
            lto_flag: ""
            USE_MIMALLOC: "ON"
            USE_EXTERNAL_MIMALLOC: "ON"
          # No arm64-lto variant: LLVM 21's CodeView emitter has no register
          # mapping for ARM64 NEON quad-register tuples ("LLVM ERROR: unknown
          # codeview register Q22_Q23_Q24_Q25") and the LTO codegen allocates
          # values into them. Re-add once that's fixed upstream.
          # arm64-debug stays on the native Windows runner: /MTd needs the
          # ARM64 *debug* CRT (libcmtd.lib), which xwin's splat doesn't
          # produce (no CRT.arm64.Debug package in the VS manifest mapping).
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.build_ref }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !LayoutTests/
            !JSTests/
      - uses: docker/setup-buildx-action@885d1462b80bc1c1c7f0b00334ad271f09369c55 # v2.10.0
        id: buildx
        with:
          install: true
      - name: Run
        run: |
          rm -rf ${{runner.temp}}/bun-webkit ${{runner.temp}}/bun-webkit.tar.gz
          WIN_ARCH="${{matrix.win_arch}}" WEBKIT_RELEASE_TYPE="${{matrix.CMAKE_BUILD_TYPE}}" LTO_FLAG="${{matrix.lto_flag}}" ENABLE_SANITIZERS="${{matrix.ENABLE_SANITIZERS}}" USE_MIMALLOC="${{matrix.USE_MIMALLOC || 'OFF'}}" USE_EXTERNAL_MIMALLOC="${{matrix.USE_EXTERNAL_MIMALLOC || 'OFF'}}" temp=${{runner.temp}} bash windows-cross-release.sh
          cd ${{runner.temp}}
          echo "#define BUN_WEBKIT_VERSION \"${{ inputs.build_ref }}\"" >> bun-webkit/include/cmakeconfig.h
          echo '{ "name": "${{matrix.label}}", "version": "0.0.1-${{ inputs.build_ref }}", "os": ["windows"], "cpu": ["${{matrix.package_json_arch}}"], "repository": "https://github.com/${{github.repository}}" }' > bun-webkit/package.json
          tar -czf bun-webkit.tar.gz bun-webkit
          rm -rf bun-webkit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{matrix.label}}
          path: ${{runner.temp}}/bun-webkit.tar.gz

  windows:
    name: Windows
    # Only arm64-debug still builds on a native Windows runner: the /MTd
    # debug CRT for ARM64 (libcmtd.lib) isn't available via xwin, so it
    # can't be cross-compiled from Linux yet. Everything else moved to the
    # `windows-cross` job above.
    strategy:
      matrix:
        include:
          - runner: windows-11-arm
            build-type: Debug
            package_json_arch: "arm64"
            label: bun-webkit-windows-arm64-debug
            platform: ARM64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Install Scoop
        run: |
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser
          Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
          Join-Path (Resolve-Path ~).Path "scoop\shims" >> $Env:GITHUB_PATH
      - name: Install LLVM and Ninja (ARM64)
        if: matrix.platform == 'ARM64'
        run: |
          "C:\Program Files\7-Zip" >> $Env:GITHUB_PATH
          scoop config use_external_7zip true
          scoop install ninja
          # Install LLVM ARM64 from official LLVM releases
          # Use LLVM 21 for ARM64 - has better Windows ARM64 support and fixes SEH unwind bugs
          $llvmVersion = "21.1.8"
          $llvmUrl = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$llvmVersion/LLVM-$llvmVersion-woa64.exe"
          $llvmPath = "C:\LLVM"
          Invoke-WebRequest -Uri $llvmUrl -OutFile "$env:TEMP\llvm-arm64.exe"
          & "C:\Program Files\7-Zip\7z.exe" x "$env:TEMP\llvm-arm64.exe" -o"$llvmPath" -y
          "$llvmPath\bin" >> $Env:GITHUB_PATH
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.build_ref }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !LayoutTests/
            !JSTests/
      - name: Build WebKit
        run: |
          if ("${{matrix.platform}}" -eq "ARM64") {
            $env:Path = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\arm64\;" + $env:Path
          } else {
            $env:Path = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\;" + $env:Path
          }
          $env:WEBKIT_OUTPUT_DIR = "bun-webkit"
          $env:BUN_WEBKIT_VERSION = "${{ inputs.build_ref }}"
          $env:CMAKE_BUILD_TYPE = "${{matrix.build-type}}"
          $env:PACKAGE_JSON_LABEL = "${{matrix.label}}"
          $env:GITHUB_SHA = "${{ inputs.build_ref }}"
          $env:PACKAGE_JSON_ARCH = "${{matrix.package_json_arch}}"
          $env:GITHUB_REPOSITORY = "${{ github.repository }}"
          ./windows-release.ps1 -Platform ${{matrix.platform}}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{matrix.label}}
          path: bun-webkit.tar.gz

  linux-musl:
    name: Linux musl
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        include:
          - lto_flag: ""
            label: bun-webkit-linux-amd64-musl-debug
            os: linux-x64-gh
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "Debug"
          - lto_flag: ""
            label: bun-webkit-linux-arm64-musl-debug
            os: linux-arm64-gh
            package_json_arch: "arm64"
            CMAKE_BUILD_TYPE: "Debug"
          - lto_flag: "-flto=thin -fno-split-lto-unit -fwhole-program-vtables -fforce-emit-vtables"
            label: bun-webkit-linux-arm64-musl-lto
            os: linux-arm64-gh
            package_json_arch: "arm64"
            CMAKE_BUILD_TYPE: "MinSizeRel"
            USE_MIMALLOC: "ON"
            USE_EXTERNAL_MIMALLOC: "ON"
          - lto_flag: ""
            label: bun-webkit-linux-arm64-musl
            os: linux-arm64-gh
            package_json_arch: "arm64"
            CMAKE_BUILD_TYPE: "MinSizeRel"
            USE_MIMALLOC: "ON"
            USE_EXTERNAL_MIMALLOC: "ON"
          - lto_flag: "-flto=thin -fno-split-lto-unit -fwhole-program-vtables -fforce-emit-vtables"
            label: bun-webkit-linux-amd64-musl-lto
            os: linux-x64-gh
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "MinSizeRel"
            USE_MIMALLOC: "ON"
            USE_EXTERNAL_MIMALLOC: "ON"
          - lto_flag: ""
            label: bun-webkit-linux-amd64-musl
            os: linux-x64-gh
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "MinSizeRel"
            USE_MIMALLOC: "ON"
            USE_EXTERNAL_MIMALLOC: "ON"
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.build_ref }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !LayoutTests/
            !JSTests/
      - uses: docker/setup-buildx-action@885d1462b80bc1c1c7f0b00334ad271f09369c55 # v2.10.0
        id: buildx
        with:
          install: true
      - name: Run
        run: |
          rm -rf ${{runner.temp}}/bun-webkit ${{runner.temp}}/bun-webkit.tar.gz
          if [ "${{matrix.package_json_arch}}" = "arm64" ]; then
            export MARCH_FLAG="-march=armv8-a+crc -mtune=ampere1"
          else
            export MARCH_FLAG="${{ matrix.MARCH_FLAG || '-march=nehalem' }}"
          fi
          WEBKIT_RELEASE_TYPE=${{matrix.CMAKE_BUILD_TYPE}} CPU="native" cpu=native LTO_FLAG="${{matrix.lto_flag}}" USE_MIMALLOC="${{matrix.USE_MIMALLOC || 'OFF'}}" USE_EXTERNAL_MIMALLOC="${{matrix.USE_EXTERNAL_MIMALLOC || 'OFF'}}" temp=${{runner.temp}} bash musl-release.sh
          cd ${{runner.temp}}
          echo "#define BUN_WEBKIT_VERSION \"${{ inputs.build_ref }}\"" >> bun-webkit/include/cmakeconfig.h
          echo '{ "name": "${{matrix.label}}", "version": "0.0.1-${{ inputs.build_ref }}", "os": ["linux"], "cpu": ["${{matrix.package_json_arch}}"], "repository": "https://github.com/${{github.repository}}" }' > bun-webkit/package.json
          rm -rf bun-webkit/lib/*.so
          rm -rf bun-webkit/lib/*.so.*
          tar -czf bun-webkit.tar.gz bun-webkit
          rm -rf bun-webkit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{matrix.label}}
          path: ${{runner.temp}}/bun-webkit.tar.gz

  macos-cross:
    name: macOS (cross-compiled from Linux)
    # Cross-compiled from a Linux host via clang --target + a pinned macOS SDK,
    # linked with ld64.lld (see Dockerfile.macos). Replaces the native macOS
    # runner job entirely and adds the -lto variants it never built. The ASAN
    # variants link against the darwin sanitizer runtime mirrored at the
    # compiler-rt-darwin-* release tag (a Linux LLVM install doesn't ship it).
    # mac-release.bash remains for building on a real Mac locally.
    runs-on: linux-x64-gh
    strategy:
      matrix:
        include:
          - label: bun-webkit-macos-arm64
            macos_arch: arm64
            package_json_arch: "arm64"
            CMAKE_BUILD_TYPE: "Release"
            lto_flag: ""
            USE_MIMALLOC: "ON"
            USE_EXTERNAL_MIMALLOC: "ON"
          - label: bun-webkit-macos-arm64-lto
            macos_arch: arm64
            package_json_arch: "arm64"
            CMAKE_BUILD_TYPE: "Release"
            lto_flag: "-flto=thin -fno-split-lto-unit -fwhole-program-vtables -fforce-emit-vtables"
            USE_MIMALLOC: "ON"
            USE_EXTERNAL_MIMALLOC: "ON"
          - label: bun-webkit-macos-arm64-debug
            macos_arch: arm64
            package_json_arch: "arm64"
            CMAKE_BUILD_TYPE: "Debug"
            lto_flag: ""
            cpp_flags: "-D_LIBCXX_ENABLE_ASSERTIONS=1"
          - label: bun-webkit-macos-amd64
            macos_arch: x86_64
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "Release"
            lto_flag: ""
            USE_MIMALLOC: "ON"
            USE_EXTERNAL_MIMALLOC: "ON"
          - label: bun-webkit-macos-amd64-lto
            macos_arch: x86_64
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "Release"
            lto_flag: "-flto=thin -fno-split-lto-unit -fwhole-program-vtables -fforce-emit-vtables"
            USE_MIMALLOC: "ON"
            USE_EXTERNAL_MIMALLOC: "ON"
          - label: bun-webkit-macos-amd64-debug
            macos_arch: x86_64
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "Debug"
            lto_flag: ""
            cpp_flags: "-D_LIBCXX_ENABLE_ASSERTIONS=1"
          # ASAN: arm64 only — the mirrored darwin sanitizer runtime
          # (compiler-rt-darwin release tag) is extracted from the official
          # LLVM macOS release, which is published for arm64 only.
          - label: bun-webkit-macos-arm64-asan
            macos_arch: arm64
            package_json_arch: "arm64"
            CMAKE_BUILD_TYPE: "Release"
            lto_flag: ""
            cpp_flags: "-D_LIBCXX_ENABLE_ASSERTIONS=1"
            ENABLE_SANITIZERS: "address,undefined"
          - label: bun-webkit-macos-arm64-debug-asan
            macos_arch: arm64
            package_json_arch: "arm64"
            CMAKE_BUILD_TYPE: "Debug"
            lto_flag: ""
            cpp_flags: "-D_LIBCXX_ENABLE_ASSERTIONS=1"
            ENABLE_SANITIZERS: "address,undefined"
            ENABLE_MALLOC_HEAP_BREAKDOWN: "OFF"
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.build_ref }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !LayoutTests/
            !JSTests/
      - uses: docker/setup-buildx-action@885d1462b80bc1c1c7f0b00334ad271f09369c55 # v2.10.0
        id: buildx
        with:
          install: true
      - name: Run
        run: |
          rm -rf ${{runner.temp}}/bun-webkit ${{runner.temp}}/bun-webkit.tar.gz
          MACOS_ARCH="${{matrix.macos_arch}}" WEBKIT_RELEASE_TYPE="${{matrix.CMAKE_BUILD_TYPE}}" LTO_FLAG="${{matrix.lto_flag}}" CPP_FLAGS="${{matrix.cpp_flags}}" ENABLE_SANITIZERS="${{matrix.ENABLE_SANITIZERS}}" ENABLE_MALLOC_HEAP_BREAKDOWN="${{matrix.ENABLE_MALLOC_HEAP_BREAKDOWN}}" USE_MIMALLOC="${{matrix.USE_MIMALLOC || 'OFF'}}" USE_EXTERNAL_MIMALLOC="${{matrix.USE_EXTERNAL_MIMALLOC || 'OFF'}}" temp=${{runner.temp}} bash macos-cross-release.sh
          cd ${{runner.temp}}
          echo "#define BUN_WEBKIT_VERSION \"${{ inputs.build_ref }}\"" >> bun-webkit/include/cmakeconfig.h
          echo '{ "name": "${{matrix.label}}", "version": "0.0.1-${{ inputs.build_ref }}", "os": ["darwin"], "cpu": ["${{matrix.package_json_arch}}"], "repository": "https://github.com/${{github.repository}}" }' > bun-webkit/package.json
          tar -czf bun-webkit.tar.gz bun-webkit
          rm -rf bun-webkit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{matrix.label}}
          path: ${{runner.temp}}/bun-webkit.tar.gz

  freebsd:
    name: FreeBSD
    # Cross-compiled from a Linux host via clang --target + base.txz sysroot,
    # so all FreeBSD targets build on x64 regardless of target arch.
    runs-on: linux-x64-gh
    strategy:
      matrix:
        include:
          - label: bun-webkit-freebsd-amd64
            freebsd_arch: x86_64
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "Release"
            USE_MIMALLOC: "ON"
            USE_EXTERNAL_MIMALLOC: "ON"
          - label: bun-webkit-freebsd-amd64-lto
            lto_flag: "-flto=thin -fno-split-lto-unit -fwhole-program-vtables -fforce-emit-vtables"
            freebsd_arch: x86_64
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "Release"
            USE_MIMALLOC: "ON"
            USE_EXTERNAL_MIMALLOC: "ON"
          - label: bun-webkit-freebsd-amd64-debug
            freebsd_arch: x86_64
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "Debug"
          - label: bun-webkit-freebsd-arm64
            freebsd_arch: aarch64
            package_json_arch: "arm64"
            CMAKE_BUILD_TYPE: "Release"
            USE_MIMALLOC: "ON"
            USE_EXTERNAL_MIMALLOC: "ON"
          - label: bun-webkit-freebsd-arm64-lto
            lto_flag: "-flto=thin -fno-split-lto-unit -fwhole-program-vtables -fforce-emit-vtables"
            freebsd_arch: aarch64
            package_json_arch: "arm64"
            CMAKE_BUILD_TYPE: "Release"
            USE_MIMALLOC: "ON"
            USE_EXTERNAL_MIMALLOC: "ON"
          - label: bun-webkit-freebsd-arm64-debug
            freebsd_arch: aarch64
            package_json_arch: "arm64"
            CMAKE_BUILD_TYPE: "Debug"
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.build_ref }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !LayoutTests/
            !JSTests/
      - uses: docker/setup-buildx-action@885d1462b80bc1c1c7f0b00334ad271f09369c55 # v2.10.0
        id: buildx
        with:
          install: true
      - name: Run
        run: |
          rm -rf ${{runner.temp}}/bun-webkit ${{runner.temp}}/bun-webkit.tar.gz
          FREEBSD_ARCH="${{matrix.freebsd_arch}}" WEBKIT_RELEASE_TYPE="${{matrix.CMAKE_BUILD_TYPE}}" LTO_FLAG="${{matrix.lto_flag}}" USE_MIMALLOC="${{matrix.USE_MIMALLOC || 'OFF'}}" USE_EXTERNAL_MIMALLOC="${{matrix.USE_EXTERNAL_MIMALLOC || 'OFF'}}" temp=${{runner.temp}} bash freebsd-release.sh
          cd ${{runner.temp}}
          echo "#define BUN_WEBKIT_VERSION \"${{ inputs.build_ref }}\"" >> bun-webkit/include/cmakeconfig.h
          echo '{ "name": "${{matrix.label}}", "version": "0.0.1-${{ inputs.build_ref }}", "os": ["freebsd"], "cpu": ["${{matrix.package_json_arch}}"], "repository": "https://github.com/${{github.repository}}" }' > bun-webkit/package.json
          rm -rf bun-webkit/lib/*.so bun-webkit/lib/*.so.*
          tar -czf bun-webkit.tar.gz bun-webkit
          rm -rf bun-webkit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{matrix.label}}
          path: ${{runner.temp}}/bun-webkit.tar.gz

  linux-android:
    name: Linux Android
    # NDK only ships linux-x86_64 prebuilts, so all Android targets
    # cross-compile from x64 regardless of target arch.
    runs-on: linux-x64-gh
    strategy:
      matrix:
        include:
          - label: bun-webkit-linux-arm64-android
            android_arch: aarch64
            package_json_arch: "arm64"
            CMAKE_BUILD_TYPE: "Release"
            USE_MIMALLOC: "ON"
            USE_EXTERNAL_MIMALLOC: "ON"
          - label: bun-webkit-linux-arm64-android-lto
            lto_flag: "-flto=thin -fno-split-lto-unit -fwhole-program-vtables -fforce-emit-vtables"
            android_arch: aarch64
            package_json_arch: "arm64"
            CMAKE_BUILD_TYPE: "Release"
            USE_MIMALLOC: "ON"
            USE_EXTERNAL_MIMALLOC: "ON"
          - label: bun-webkit-linux-arm64-android-debug
            android_arch: aarch64
            package_json_arch: "arm64"
            CMAKE_BUILD_TYPE: "Debug"
          - label: bun-webkit-linux-amd64-android
            android_arch: x86_64
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "Release"
            USE_MIMALLOC: "ON"
            USE_EXTERNAL_MIMALLOC: "ON"
          - label: bun-webkit-linux-amd64-android-lto
            lto_flag: "-flto=thin -fno-split-lto-unit -fwhole-program-vtables -fforce-emit-vtables"
            android_arch: x86_64
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "Release"
            USE_MIMALLOC: "ON"
            USE_EXTERNAL_MIMALLOC: "ON"
          - label: bun-webkit-linux-amd64-android-debug
            android_arch: x86_64
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "Debug"
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.build_ref }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !LayoutTests/
            !JSTests/
      - uses: docker/setup-buildx-action@885d1462b80bc1c1c7f0b00334ad271f09369c55 # v2.10.0
        id: buildx
        with:
          install: true
      - name: Run
        run: |
          rm -rf ${{runner.temp}}/bun-webkit ${{runner.temp}}/bun-webkit.tar.gz
          ANDROID_ARCH="${{matrix.android_arch}}" WEBKIT_RELEASE_TYPE="${{matrix.CMAKE_BUILD_TYPE}}" LTO_FLAG="${{matrix.lto_flag}}" USE_MIMALLOC="${{matrix.USE_MIMALLOC || 'OFF'}}" USE_EXTERNAL_MIMALLOC="${{matrix.USE_EXTERNAL_MIMALLOC || 'OFF'}}" temp=${{runner.temp}} bash android-release.sh
          cd ${{runner.temp}}
          echo "#define BUN_WEBKIT_VERSION \"${{ inputs.build_ref }}\"" >> bun-webkit/include/cmakeconfig.h
          echo '{ "name": "${{matrix.label}}", "version": "0.0.1-${{ inputs.build_ref }}", "os": ["android"], "cpu": ["${{matrix.package_json_arch}}"], "repository": "https://github.com/${{github.repository}}" }' > bun-webkit/package.json
          rm -rf bun-webkit/lib/*.so bun-webkit/lib/*.so.*
          tar -czf bun-webkit.tar.gz bun-webkit
          rm -rf bun-webkit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{matrix.label}}
          path: ${{runner.temp}}/bun-webkit.tar.gz

  release:
    name: release
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs:
      - linux
      - macos-cross
      - windows
      - windows-cross
      - linux-musl
      - linux-android
      - freebsd
    outputs:
      tag: ${{ steps.release_info.outputs.tag }}
    steps:
      - run: uname -a
      - run: free
      - run: env
      - run: mount
      - run: lscpu
      - run: lsmem
      - run: lsblk
      - run: lspci
      - run: lsipc
      - run: whoami

      # Every build job uploads <label>/bun-webkit.tar.gz. This list is the release: a label missing from the run fails the job.
      - name: Download artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARTIFACTS: |
            # linux
            bun-webkit-linux-amd64
            bun-webkit-linux-amd64-lto
            bun-webkit-linux-amd64-debug
            bun-webkit-linux-amd64-asan
            bun-webkit-linux-amd64-debug-asan
            bun-webkit-linux-arm64
            bun-webkit-linux-arm64-lto
            bun-webkit-linux-arm64-debug
            bun-webkit-linux-arm64-asan
            bun-webkit-linux-arm64-debug-asan
            # linux-musl
            bun-webkit-linux-amd64-musl
            bun-webkit-linux-amd64-musl-lto
            bun-webkit-linux-amd64-musl-debug
            bun-webkit-linux-arm64-musl
            bun-webkit-linux-arm64-musl-lto
            bun-webkit-linux-arm64-musl-debug
            # macos-cross
            bun-webkit-macos-arm64
            bun-webkit-macos-arm64-lto
            bun-webkit-macos-arm64-debug
            bun-webkit-macos-arm64-asan
            bun-webkit-macos-arm64-debug-asan
            bun-webkit-macos-amd64
            bun-webkit-macos-amd64-lto
            bun-webkit-macos-amd64-debug
            # windows / windows-cross
            bun-webkit-windows-amd64
            bun-webkit-windows-amd64-lto
            bun-webkit-windows-amd64-debug
            bun-webkit-windows-amd64-asan
            bun-webkit-windows-arm64
            bun-webkit-windows-arm64-debug
            # freebsd
            bun-webkit-freebsd-amd64
            bun-webkit-freebsd-amd64-lto
            bun-webkit-freebsd-amd64-debug
            bun-webkit-freebsd-arm64
            bun-webkit-freebsd-arm64-lto
            bun-webkit-freebsd-arm64-debug
            # linux-android
            bun-webkit-linux-arm64-android
            bun-webkit-linux-arm64-android-lto
            bun-webkit-linux-arm64-android-debug
            bun-webkit-linux-amd64-android
            bun-webkit-linux-amd64-android-lto
            bun-webkit-linux-amd64-android-debug
        run: |
          set -euo pipefail
          grep -v '^ *#' <<< "$ARTIFACTS" | grep . > artifacts.txt
          echo "$(wc -l < artifacts.txt) artifacts"
          xargs -P 16 -I{} sh -euc '
            for attempt in 1 2 3 4 5; do
              rm -rf "dl/$1"
              gh run download "$GITHUB_RUN_ID" -n "$1" -D "dl/$1" && { echo "downloaded $1"; exit 0; }
              echo "download of $1 failed (attempt $attempt)"; sleep $((attempt * 5))
            done
            exit 1' _ {} < artifacts.txt
          mkdir -p out
          while read -r name; do mv "dl/$name/bun-webkit.tar.gz" "out/$name.tar.gz"; done < artifacts.txt
          ls -la out

      # A bytecode cache payload written on one platform is read in place on the others (bun build --compile
      # cross-compiles), so the records it is made of must be laid out identically everywhere. Each build recorded its
      # layouts (Tools/Scripts/dump-bytecode-cache-layout.ts); any difference from linux-amd64 fails the release.
      - name: Bytecode cache layouts agree across platforms
        run: |
          set -euo pipefail
          mkdir -p layouts
          for archive in out/*.tar.gz; do
            name=$(basename "$archive" .tar.gz)
            tar -xzf "$archive" -O bun-webkit/bytecode-cache-layout.txt > "layouts/$name.txt" 2>/dev/null || rm -f "layouts/$name.txt"
          done
          ls layouts
          test -s layouts/bun-webkit-linux-amd64.txt
          status=0
          for f in layouts/*.txt; do
            if ! diff -u layouts/bun-webkit-linux-amd64.txt "$f" > "$f.diff"; then
              echo "::error::bytecode cache record layouts in $(basename "$f" .txt) differ from linux-amd64"
              head -50 "$f.diff"
              status=1
            fi
          done
          echo "$(ls layouts/*.txt | wc -l) platforms compared"
          exit $status

      - name: Set release info
        id: release_info
        run: |
          echo "tag=${{ inputs.release_tag }}" >> $GITHUB_OUTPUT

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag }}
          PRERELEASE: ${{ inputs.is_prerelease }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            flags=(--title "$TAG" --generate-notes)
            [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
            gh release create "$TAG" "${flags[@]}"
          fi
          # a release just created is not visible to every API replica yet; uploads racing it get "release not found"
          for i in $(seq 1 30); do gh release view "$TAG" >/dev/null 2>&1 && break; sleep 2; done
          gh release view "$TAG" >/dev/null
          xargs -P 8 -I{} sh -euc '
            for attempt in 1 2 3 4 5; do
              gh release upload "$TAG" "out/$1.tar.gz" --clobber && { echo "uploaded $1"; exit 0; }
              echo "upload of $1 failed (attempt $attempt)"; sleep $((attempt * 5))
            done
            exit 1' _ {} < artifacts.txt || true
          gh release view "$TAG" --json assets --jq '.assets[].name' | sed 's/\.tar\.gz$//' | sort > uploaded.txt
          if missing=$(comm -23 <(sort artifacts.txt) uploaded.txt | grep .); then
            echo "assets missing from $TAG:"; echo "$missing"; exit 1
          fi
          echo "$(wc -l < uploaded.txt) assets on $TAG"
