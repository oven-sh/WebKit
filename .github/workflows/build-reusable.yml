name: Build WebKit (Reusable)

env:
  LLVM_VERSION: 21

on:
  workflow_call:
    inputs:
      build_ref:
        description: 'Git ref to build (commit SHA, branch, or tag)'
        type: string
        required: true
      release_tag:
        description: 'Full release tag (including autobuild- prefix)'
        type: string
        required: true
      is_prerelease:
        description: 'Mark release as prerelease'
        type: boolean
        default: false
      llvm_version:
        description: 'LLVM version to use'
        type: string
        default: '19'
    outputs:
      release_tag:
        description: 'The release tag that was created'
        value: ${{ jobs.release.outputs.tag }}

jobs:
  # The release exists, as a draft, before any build finishes: each build job uploads its tarball straight onto it
  # and the `release` job publishes it once every asset is there (or deletes it if anything failed). A draft has no
  # tag and is invisible to anyone without push access, so a half-built release is never downloadable.
  create-release:
    name: Create draft release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - name: Create draft release
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag }}
          TARGET: ${{ inputs.build_ref }}
          PRERELEASE: ${{ inputs.is_prerelease }}
        run: |
          set -euo pipefail
          # A release for this tag can exist from an earlier run. Published (this is a re-run of a run that succeeded):
          # keep it, the build jobs overwrite its assets. Draft (a run that was cancelled before it could clean up, or
          # a run against the same tag still in flight): replace it, so that nothing stale is published under this run.
          if existing=$(gh release view "$TAG" --json databaseId,isDraft 2>/dev/null); then
            id=$(jq -r .databaseId <<< "$existing")
            if [ "$(jq -r .isDraft <<< "$existing")" = false ]; then
              echo "release $TAG is already published (id $id), reusing it"
              echo "release_id=$id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "replacing stale draft of $TAG (id $id)"
            gh api -X DELETE "repos/$GH_REPO/releases/$id"
          fi
          # The tag is created when the draft is published, so it is pinned to the built commit here. The API takes a
          # full SHA or a branch, so build_ref (which may be a short SHA or a tag) is resolved first.
          target=$(gh api "repos/$GH_REPO/commits/$TARGET" --jq .sha)
          created=$(gh api -X POST "repos/$GH_REPO/releases" \
            -f tag_name="$TAG" -f name="$TAG" -f target_commitish="$target" \
            -F draft=true -F prerelease="$PRERELEASE" -F generate_release_notes=true \
            --jq '"\(.id) \(.html_url)"')
          echo "created draft $created"
          echo "release_id=${created%% *}" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux
    permissions:
      contents: write
    runs-on: ${{matrix.os}}
    strategy:
      # One variant's failure shouldn't cancel the others.
      fail-fast: false
      matrix:
        include:
          - lto_flag: ""
            label: bun-webkit-linux-amd64-debug
            os: linux-x64-gh
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "Debug"
            RELEASE_FLAGS: "-O3 -DNDEBUG=1"
          - lto_flag: ""
            label: bun-webkit-linux-arm64-debug
            os: linux-arm64-gh
            package_json_arch: "arm64"
            CMAKE_BUILD_TYPE: "Debug"
            RELEASE_FLAGS: "-O3 -DNDEBUG=1"
          - lto_flag: ""
            label: bun-webkit-linux-arm64-debug-asan
            os: linux-arm64-gh
            package_json_arch: "arm64"
            CMAKE_BUILD_TYPE: "Debug"
            RELEASE_FLAGS: "-O3 -DNDEBUG=1"
            ENABLE_SANITIZERS: "address,undefined"
          - lto_flag: ""
            label: bun-webkit-linux-amd64-debug-asan
            os: linux-x64-gh
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "Debug"
            RELEASE_FLAGS: "-O3 -DNDEBUG=1"
            ENABLE_SANITIZERS: "address,undefined"
          - lto_flag: "-flto=thin -fno-split-lto-unit -fwhole-program-vtables -fforce-emit-vtables"
            label: bun-webkit-linux-arm64-lto
            os: linux-arm64-gh
            package_json_arch: "arm64"
            CMAKE_BUILD_TYPE: "Release"
            RELEASE_FLAGS: "-O3 -DNDEBUG=1"
            USE_MIMALLOC: "ON"
            USE_EXTERNAL_MIMALLOC: "ON"
          - lto_flag: ""
            label: bun-webkit-linux-arm64
            os: linux-arm64-gh
            package_json_arch: "arm64"
            CMAKE_BUILD_TYPE: "Release"
            RELEASE_FLAGS: "-O3 -DNDEBUG=1"
            USE_MIMALLOC: "ON"
            USE_EXTERNAL_MIMALLOC: "ON"
          - lto_flag: "-flto=thin -fno-split-lto-unit -fwhole-program-vtables -fforce-emit-vtables"
            label: bun-webkit-linux-amd64-lto
            os: linux-x64-gh
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "Release"
            RELEASE_FLAGS: "-O3 -DNDEBUG=1"
            USE_MIMALLOC: "ON"
            USE_EXTERNAL_MIMALLOC: "ON"
          - lto_flag: ""
            label: bun-webkit-linux-amd64
            os: linux-x64-gh
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "Release"
            RELEASE_FLAGS: "-O3 -DNDEBUG=1"
            USE_MIMALLOC: "ON"
            USE_EXTERNAL_MIMALLOC: "ON"
          - lto_flag: ""
            label: bun-webkit-linux-amd64-asan
            os: linux-x64-gh
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "Release"
            RELEASE_FLAGS: "-O3 -DNDEBUG=1"
            ENABLE_SANITIZERS: "address,undefined"
          - lto_flag: ""
            label: bun-webkit-linux-arm64-asan
            os: linux-arm64-gh
            package_json_arch: "arm64"
            CMAKE_BUILD_TYPE: "Release"
            RELEASE_FLAGS: "-O3 -DNDEBUG=1"
            ENABLE_SANITIZERS: "address,undefined"
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.build_ref }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !LayoutTests/
            !JSTests/
      - uses: docker/setup-buildx-action@885d1462b80bc1c1c7f0b00334ad271f09369c55 # v2.10.0
        id: buildx
        with:
          install: true
      - name: Run
        env:
          RELEASE_FLAGS: ${{matrix.RELEASE_FLAGS}}
          ENABLE_SANITIZERS: ${{matrix.ENABLE_SANITIZERS}}
        run: |
          rm -rf ${{runner.temp}}/bun-webkit ${{runner.temp}}/bun-webkit.tar.gz
          # Explicit --target: Ubuntu's clang defaults to x86_64-pc-linux-gnu, while bun's own
          # objects and its Rust code are <arch>-unknown-linux-gnu; with LTO, lld warns about
          # the vendor mismatch once per JavaScriptCore object.
          if [ "${{matrix.package_json_arch}}" = "arm64" ]; then
            export MARCH_FLAG="--target=aarch64-unknown-linux-gnu -march=armv8-a+crc -mtune=ampere1"
          else
            export MARCH_FLAG="--target=x86_64-unknown-linux-gnu ${{ matrix.MARCH_FLAG || '-march=nehalem' }}"
          fi
          WEBKIT_RELEASE_TYPE=${{matrix.CMAKE_BUILD_TYPE}} CPU="native" cpu=native LTO_FLAG="${{matrix.lto_flag}}" temp=${{runner.temp}} ENABLE_SANITIZERS="${{matrix.ENABLE_SANITIZERS}}" USE_MIMALLOC="${{matrix.USE_MIMALLOC || 'OFF'}}" USE_EXTERNAL_MIMALLOC="${{matrix.USE_EXTERNAL_MIMALLOC || 'OFF'}}" bash release.sh
          cd ${{runner.temp}}
          echo "#define BUN_WEBKIT_VERSION \"${{ inputs.build_ref }}\"" >> bun-webkit/include/cmakeconfig.h
          echo '{ "name": "${{matrix.label}}", "version": "0.0.1-${{ inputs.build_ref }}", "os": ["linux"], "cpu": ["${{matrix.package_json_arch}}"], "repository": "https://github.com/${{github.repository}}" }' > bun-webkit/package.json
          rm -rf bun-webkit/lib/*.so
          rm -rf bun-webkit/lib/*.so.*
          tar -czf bun-webkit.tar.gz bun-webkit
          rm -rf bun-webkit
      # The one copy of the upload step. The other build jobs alias it (YAML anchors, supported by Actions since 2025-08).
      - name: Upload release asset
        env: &upload_env
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag }}
          LABEL: ${{ matrix.label }}
          DIR: ${{ runner.temp }}
        run: &upload_run |
          set -euo pipefail
          mv "$DIR/bun-webkit.tar.gz" "$DIR/$LABEL.tar.gz"
          # create-release runs alongside this job and is normally long done; wait for it rather than fail.
          for i in $(seq 1 60); do gh release view "$TAG" >/dev/null 2>&1 && break; sleep 10; done
          gh release view "$TAG" >/dev/null 2>&1 || { echo "::error::no release for $TAG. After a failed run use 'Re-run all jobs' so that create-release runs again."; exit 1; }
          for attempt in 1 2 3 4 5; do
            gh release upload "$TAG" "$DIR/$LABEL.tar.gz" --clobber && { echo "uploaded $LABEL"; exit 0; }
            echo "upload of $LABEL failed (attempt $attempt)"; sleep $((attempt * 10))
          done
          exit 1

  windows-cross:
    name: Windows (cross-compiled from Linux)
    # Cross-compiled from a Linux host: clang-cl --target + an xwin-downloaded
    # MSVC CRT/Windows SDK + lld-link (see Dockerfile.windows). Replaces the
    # native Windows runner job (except arm64-debug — see the `windows` job
    # below) and adds the -lto variants it never built. windows-release.ps1
    # remains for building on a real Windows machine.
    permissions:
      contents: write
    runs-on: linux-x64-gh
    strategy:
      # One variant's failure shouldn't cancel the others.
      fail-fast: false
      matrix:
        include:
          - label: bun-webkit-windows-amd64
            win_arch: x64
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "Release"
            lto_flag: ""
            USE_MIMALLOC: "ON"
            USE_EXTERNAL_MIMALLOC: "ON"
          - label: bun-webkit-windows-amd64-lto
            win_arch: x64
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "Release"
            # ThinLTO like the macOS -lto variants: the bitcode carries ThinLTO
            # summaries so the consumer's link gets parallel backends + cross
            # -language importing instead of one giant serial full-LTO module.
            # -fno-split-lto-unit keeps every module a pure summary module
            # (consistent with rustc's bitcode, which never splits).
            # Unlike linux/macos there is no -fwhole-program-vtables
            # -fforce-emit-vtables here: WPD drops vtable symbols that COFF
            # associative COMDAT sections still name as their parent and the
            # LTO codegen aborts ("Associative COMDAT symbol '??_7...' does
            # not exist").
            lto_flag: "/clang:-flto=thin /clang:-fno-split-lto-unit"
            USE_MIMALLOC: "ON"
            USE_EXTERNAL_MIMALLOC: "ON"
          - label: bun-webkit-windows-amd64-debug
            win_arch: x64
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "Debug"
            lto_flag: ""
          # ASAN is x64-only: LLVM ships no Windows ARM64 ASAN runtime. The
          # sanitizer runtime (import lib, /MT runtime thunk, DLL) comes from
          # the compiler-rt-windows-* release tag (see Dockerfile.windows).
          - label: bun-webkit-windows-amd64-asan
            win_arch: x64
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "Release"
            lto_flag: ""
            ENABLE_SANITIZERS: "address,undefined"
          - label: bun-webkit-windows-arm64
            win_arch: arm64
            package_json_arch: "arm64"
            CMAKE_BUILD_TYPE: "Release"
            lto_flag: ""
            USE_MIMALLOC: "ON"
            USE_EXTERNAL_MIMALLOC: "ON"
          # No arm64-lto variant: LLVM 21's CodeView emitter has no register
          # mapping for ARM64 NEON quad-register tuples ("LLVM ERROR: unknown
          # codeview register Q22_Q23_Q24_Q25") and the LTO codegen allocates
          # values into them. Re-add once that's fixed upstream.
          # arm64-debug stays on the native Windows runner: /MTd needs the
          # ARM64 *debug* CRT (libcmtd.lib), which xwin's splat doesn't
          # produce (no CRT.arm64.Debug package in the VS manifest mapping).
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.build_ref }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !LayoutTests/
            !JSTests/
      - uses: docker/setup-buildx-action@885d1462b80bc1c1c7f0b00334ad271f09369c55 # v2.10.0
        id: buildx
        with:
          install: true
      - name: Run
        run: |
          rm -rf ${{runner.temp}}/bun-webkit ${{runner.temp}}/bun-webkit.tar.gz
          WIN_ARCH="${{matrix.win_arch}}" WEBKIT_RELEASE_TYPE="${{matrix.CMAKE_BUILD_TYPE}}" LTO_FLAG="${{matrix.lto_flag}}" ENABLE_SANITIZERS="${{matrix.ENABLE_SANITIZERS}}" USE_MIMALLOC="${{matrix.USE_MIMALLOC || 'OFF'}}" USE_EXTERNAL_MIMALLOC="${{matrix.USE_EXTERNAL_MIMALLOC || 'OFF'}}" temp=${{runner.temp}} bash windows-cross-release.sh
          cd ${{runner.temp}}
          echo "#define BUN_WEBKIT_VERSION \"${{ inputs.build_ref }}\"" >> bun-webkit/include/cmakeconfig.h
          echo '{ "name": "${{matrix.label}}", "version": "0.0.1-${{ inputs.build_ref }}", "os": ["windows"], "cpu": ["${{matrix.package_json_arch}}"], "repository": "https://github.com/${{github.repository}}" }' > bun-webkit/package.json
          tar -czf bun-webkit.tar.gz bun-webkit
          rm -rf bun-webkit
      - name: Upload release asset
        env: *upload_env
        run: *upload_run

  windows:
    name: Windows
    # Only arm64-debug still builds on a native Windows runner: the /MTd
    # debug CRT for ARM64 (libcmtd.lib) isn't available via xwin, so it
    # can't be cross-compiled from Linux yet. Everything else moved to the
    # `windows-cross` job above.
    strategy:
      matrix:
        include:
          - runner: windows-11-arm
            build-type: Debug
            package_json_arch: "arm64"
            label: bun-webkit-windows-arm64-debug
            platform: ARM64
    permissions:
      contents: write
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      # No scoop: `irm get.scoop.sh | iex` installs nothing since
      # ScoopInstaller/Install@a6210927 (the installer skips Install-Scoop
      # when $MyInvocation.InvocationName is '.', and the runner's pwsh
      # shell dot-sources every `run:` script). Nothing needed it anyway:
      # cmake and ninja come from the Visual Studio install, see the PATH
      # reorder in windows-release.ps1.
      - name: Install LLVM (ARM64)
        if: matrix.platform == 'ARM64'
        run: |
          # Install LLVM ARM64 from official LLVM releases
          # Use LLVM 21 for ARM64 - has better Windows ARM64 support and fixes SEH unwind bugs
          $llvmVersion = "21.1.8"
          $llvmUrl = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$llvmVersion/LLVM-$llvmVersion-woa64.exe"
          $llvmPath = "C:\LLVM"
          Invoke-WebRequest -Uri $llvmUrl -OutFile "$env:TEMP\llvm-arm64.exe"
          & "C:\Program Files\7-Zip\7z.exe" x "$env:TEMP\llvm-arm64.exe" -o"$llvmPath" -y
          "$llvmPath\bin" >> $Env:GITHUB_PATH
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.build_ref }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !LayoutTests/
            !JSTests/
      - name: Build WebKit
        run: |
          if ("${{matrix.platform}}" -eq "ARM64") {
            $env:Path = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\arm64\;" + $env:Path
          } else {
            $env:Path = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\;" + $env:Path
          }
          $env:WEBKIT_OUTPUT_DIR = "bun-webkit"
          $env:BUN_WEBKIT_VERSION = "${{ inputs.build_ref }}"
          $env:CMAKE_BUILD_TYPE = "${{matrix.build-type}}"
          $env:PACKAGE_JSON_LABEL = "${{matrix.label}}"
          $env:GITHUB_SHA = "${{ inputs.build_ref }}"
          $env:PACKAGE_JSON_ARCH = "${{matrix.package_json_arch}}"
          $env:GITHUB_REPOSITORY = "${{ github.repository }}"
          ./windows-release.ps1 -Platform ${{matrix.platform}}
      - name: Upload release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag }}
          LABEL: ${{ matrix.label }}
          DIR: .
        run: *upload_run

  linux-musl:
    name: Linux musl
    permissions:
      contents: write
    runs-on: ${{matrix.os}}
    strategy:
      # One variant's failure shouldn't cancel the others.
      fail-fast: false
      matrix:
        include:
          - lto_flag: ""
            label: bun-webkit-linux-amd64-musl-debug
            os: linux-x64-gh
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "Debug"
          - lto_flag: ""
            label: bun-webkit-linux-arm64-musl-debug
            os: linux-arm64-gh
            package_json_arch: "arm64"
            CMAKE_BUILD_TYPE: "Debug"
          - lto_flag: "-flto=thin -fno-split-lto-unit -fwhole-program-vtables -fforce-emit-vtables"
            label: bun-webkit-linux-arm64-musl-lto
            os: linux-arm64-gh
            package_json_arch: "arm64"
            CMAKE_BUILD_TYPE: "MinSizeRel"
            USE_MIMALLOC: "ON"
            USE_EXTERNAL_MIMALLOC: "ON"
          - lto_flag: ""
            label: bun-webkit-linux-arm64-musl
            os: linux-arm64-gh
            package_json_arch: "arm64"
            CMAKE_BUILD_TYPE: "MinSizeRel"
            USE_MIMALLOC: "ON"
            USE_EXTERNAL_MIMALLOC: "ON"
          - lto_flag: "-flto=thin -fno-split-lto-unit -fwhole-program-vtables -fforce-emit-vtables"
            label: bun-webkit-linux-amd64-musl-lto
            os: linux-x64-gh
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "MinSizeRel"
            USE_MIMALLOC: "ON"
            USE_EXTERNAL_MIMALLOC: "ON"
          - lto_flag: ""
            label: bun-webkit-linux-amd64-musl
            os: linux-x64-gh
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "MinSizeRel"
            USE_MIMALLOC: "ON"
            USE_EXTERNAL_MIMALLOC: "ON"
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.build_ref }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !LayoutTests/
            !JSTests/
      - uses: docker/setup-buildx-action@885d1462b80bc1c1c7f0b00334ad271f09369c55 # v2.10.0
        id: buildx
        with:
          install: true
      - name: Run
        run: |
          rm -rf ${{runner.temp}}/bun-webkit ${{runner.temp}}/bun-webkit.tar.gz
          if [ "${{matrix.package_json_arch}}" = "arm64" ]; then
            export MARCH_FLAG="-march=armv8-a+crc -mtune=ampere1"
          else
            export MARCH_FLAG="${{ matrix.MARCH_FLAG || '-march=nehalem' }}"
          fi
          WEBKIT_RELEASE_TYPE=${{matrix.CMAKE_BUILD_TYPE}} CPU="native" cpu=native LTO_FLAG="${{matrix.lto_flag}}" USE_MIMALLOC="${{matrix.USE_MIMALLOC || 'OFF'}}" USE_EXTERNAL_MIMALLOC="${{matrix.USE_EXTERNAL_MIMALLOC || 'OFF'}}" temp=${{runner.temp}} bash musl-release.sh
          cd ${{runner.temp}}
          echo "#define BUN_WEBKIT_VERSION \"${{ inputs.build_ref }}\"" >> bun-webkit/include/cmakeconfig.h
          echo '{ "name": "${{matrix.label}}", "version": "0.0.1-${{ inputs.build_ref }}", "os": ["linux"], "cpu": ["${{matrix.package_json_arch}}"], "repository": "https://github.com/${{github.repository}}" }' > bun-webkit/package.json
          rm -rf bun-webkit/lib/*.so
          rm -rf bun-webkit/lib/*.so.*
          tar -czf bun-webkit.tar.gz bun-webkit
          rm -rf bun-webkit
      - name: Upload release asset
        env: *upload_env
        run: *upload_run

  macos-cross:
    name: macOS (cross-compiled from Linux)
    # Cross-compiled from a Linux host via clang --target + a pinned macOS SDK,
    # linked with ld64.lld (see Dockerfile.macos). Replaces the native macOS
    # runner job entirely and adds the -lto variants it never built. The ASAN
    # variants link against the darwin sanitizer runtime mirrored at the
    # compiler-rt-darwin-* release tag (a Linux LLVM install doesn't ship it).
    # mac-release.bash remains for building on a real Mac locally.
    permissions:
      contents: write
    runs-on: linux-x64-gh
    strategy:
      # One variant's failure shouldn't cancel the others.
      fail-fast: false
      matrix:
        include:
          - label: bun-webkit-macos-arm64
            macos_arch: arm64
            package_json_arch: "arm64"
            CMAKE_BUILD_TYPE: "Release"
            lto_flag: ""
            USE_MIMALLOC: "ON"
            USE_EXTERNAL_MIMALLOC: "ON"
          - label: bun-webkit-macos-arm64-lto
            macos_arch: arm64
            package_json_arch: "arm64"
            CMAKE_BUILD_TYPE: "Release"
            lto_flag: "-flto=thin -fno-split-lto-unit -fwhole-program-vtables -fforce-emit-vtables"
            USE_MIMALLOC: "ON"
            USE_EXTERNAL_MIMALLOC: "ON"
          - label: bun-webkit-macos-arm64-debug
            macos_arch: arm64
            package_json_arch: "arm64"
            CMAKE_BUILD_TYPE: "Debug"
            lto_flag: ""
            cpp_flags: "-D_LIBCXX_ENABLE_ASSERTIONS=1"
          - label: bun-webkit-macos-amd64
            macos_arch: x86_64
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "Release"
            lto_flag: ""
            USE_MIMALLOC: "ON"
            USE_EXTERNAL_MIMALLOC: "ON"
          - label: bun-webkit-macos-amd64-lto
            macos_arch: x86_64
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "Release"
            lto_flag: "-flto=thin -fno-split-lto-unit -fwhole-program-vtables -fforce-emit-vtables"
            USE_MIMALLOC: "ON"
            USE_EXTERNAL_MIMALLOC: "ON"
          - label: bun-webkit-macos-amd64-debug
            macos_arch: x86_64
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "Debug"
            lto_flag: ""
            cpp_flags: "-D_LIBCXX_ENABLE_ASSERTIONS=1"
          # ASAN: arm64 only — the mirrored darwin sanitizer runtime
          # (compiler-rt-darwin release tag) is extracted from the official
          # LLVM macOS release, which is published for arm64 only.
          - label: bun-webkit-macos-arm64-asan
            macos_arch: arm64
            package_json_arch: "arm64"
            CMAKE_BUILD_TYPE: "Release"
            lto_flag: ""
            cpp_flags: "-D_LIBCXX_ENABLE_ASSERTIONS=1"
            ENABLE_SANITIZERS: "address,undefined"
          - label: bun-webkit-macos-arm64-debug-asan
            macos_arch: arm64
            package_json_arch: "arm64"
            CMAKE_BUILD_TYPE: "Debug"
            lto_flag: ""
            cpp_flags: "-D_LIBCXX_ENABLE_ASSERTIONS=1"
            ENABLE_SANITIZERS: "address,undefined"
            ENABLE_MALLOC_HEAP_BREAKDOWN: "OFF"
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.build_ref }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !LayoutTests/
            !JSTests/
      - uses: docker/setup-buildx-action@885d1462b80bc1c1c7f0b00334ad271f09369c55 # v2.10.0
