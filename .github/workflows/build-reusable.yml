  release:
    name: release
    # Runs whatever happened to the builds (also when the run was cancelled), so the draft never outlives the run: it
    # is published when every build job succeeded and every listed asset is on it, and deleted otherwise.
    if: always()
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - create-release
      - linux
      - macos-cross
      - windows
      - windows-cross
      - linux-musl
      - linux-android
      - freebsd
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      # Every build job uploads <label>.tar.gz. This list is the release: a label missing from it fails the job.
      - name: Publish or delete the draft
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          NEEDS: ${{ toJSON(needs) }}
          ARTIFACTS: |
            # linux
            bun-webkit-linux-amd64
            bun-webkit-linux-amd64-lto
            bun-webkit-linux-amd64-debug
            bun-webkit-linux-amd64-asan
            bun-webkit-linux-amd64-debug-asan
            bun-webkit-linux-arm64
            bun-webkit-linux-arm64-lto
            bun-webkit-linux-arm64-debug
            bun-webkit-linux-arm64-asan
            bun-webkit-linux-arm64-debug-asan
            # linux-musl
            bun-webkit-linux-amd64-musl
            bun-webkit-linux-amd64-musl-lto
            bun-webkit-linux-amd64-musl-debug
            bun-webkit-linux-arm64-musl
            bun-webkit-linux-arm64-musl-lto
            bun-webkit-linux-arm64-musl-debug
            # macos-cross
            bun-webkit-macos-arm64
            bun-webkit-macos-arm64-lto
            bun-webkit-macos-arm64-debug
            bun-webkit-macos-arm64-asan
            bun-webkit-macos-arm64-debug-asan
            bun-webkit-macos-amd64
            bun-webkit-macos-amd64-lto
            bun-webkit-macos-amd64-debug
            # windows / windows-cross
            bun-webkit-windows-amd64
            bun-webkit-windows-amd64-lto
            bun-webkit-windows-amd64-debug
            bun-webkit-windows-amd64-asan
            bun-webkit-windows-arm64
            bun-webkit-windows-arm64-debug
            # freebsd
            bun-webkit-freebsd-amd64
            bun-webkit-freebsd-amd64-lto
            bun-webkit-freebsd-amd64-debug
            bun-webkit-freebsd-arm64
            bun-webkit-freebsd-arm64-lto
            bun-webkit-freebsd-arm64-debug
            # linux-android
            bun-webkit-linux-arm64-android
            bun-webkit-linux-arm64-android-lto
            bun-webkit-linux-arm64-android-debug
            bun-webkit-linux-amd64-android
            bun-webkit-linux-amd64-android-lto
            bun-webkit-linux-amd64-android-debug
        run: |
          set -euo pipefail
          ok=true
          failed=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<< "$NEEDS")
          if [ -n "$failed" ]; then
            echo "jobs that did not succeed:"; echo "$failed"; ok=false
          else
            grep -v '^ *#' <<< "$ARTIFACTS" | grep . | sort > expected.txt
            gh api "repos/$GH_REPO/releases/$RELEASE_ID" --jq '.assets[].name' | sed 's/\.tar\.gz$//' | sort > uploaded.txt
            missing=$(comm -23 expected.txt uploaded.txt)
            if [ -n "$missing" ]; then
              echo "assets missing from $TAG:"; echo "$missing"; ok=false
            fi
          fi
          if [ "$ok" = true ]; then
            url=$(gh api -X PATCH "repos/$GH_REPO/releases/$RELEASE_ID" -F draft=false --jq .html_url)
            echo "published $TAG with $(wc -l < uploaded.txt) assets: $url"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Only the draft this run created is deleted: not a published release (a re-run of a run that succeeded),
          # and not a draft that a newer run for the same tag has replaced.
          if [ -n "$RELEASE_ID" ] && [ "$(gh api "repos/$GH_REPO/releases/$RELEASE_ID" --jq .draft 2>/dev/null || echo missing)" = true ]; then
            gh api -X DELETE "repos/$GH_REPO/releases/$RELEASE_ID"
            echo "deleted draft $TAG (id $RELEASE_ID)"
          fi
          exit 1
