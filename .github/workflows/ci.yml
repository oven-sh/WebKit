name: CI

# Builds every lane of bun-webkit and publishes them as one GitHub release; tests the lanes that are marked as tested.
#
#   push to main         release autobuild-<sha>
#   pull request         prerelease autobuild-preview-pr-<n>-<sha8>, linked from a comment on the pull request
#
#   plan ──> create-release
#        ──> build, build-tested ──> release ──> comment (pull requests)
#                        └────────> test
#
# A lane is one <label>.tar.gz on the release. The lanes (which runner, which release script, which settings, tested or
# not) are defined in .github/scripts/plan.mjs and nowhere else; `plan` turns them into the matrices of the jobs below.

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request to build a preview of. Leave empty (and run from main) to build main.'
        required: false
        type: number

permissions:
  contents: write
  pull-requests: write

concurrency:
  # A newer commit on a pull request replaces the build of the older one. Builds of main never cancel each other.
  group: ${{ (github.event.pull_request.number || inputs.pr_number) && format('preview-build-pr-{0}', github.event.pull_request.number || inputs.pr_number) || format('ci-{0}', github.sha) }}
  cancel-in-progress: ${{ (github.event.pull_request.number || inputs.pr_number) && true || false }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # What is built: the commit, the tag of the release it is published as, whether that is a prerelease, and the
      # pull request it is a preview of (empty for main).
      ref: ${{ steps.target.outputs.ref }}
      tag: ${{ steps.target.outputs.tag }}
      prerelease: ${{ steps.target.outputs.prerelease }}
      pr: ${{ steps.target.outputs.pr }}
      # Matrices ({"include": [lane, ...]}) of the lanes that are only built, of the lanes that are also tested, and
      # of the test job; and the labels of all lanes.
      build: ${{ steps.lanes.outputs.build }}
      build_tested: ${{ steps.lanes.outputs.build_tested }}
      test: ${{ steps.lanes.outputs.test }}
      labels: ${{ steps.lanes.outputs.labels }}
    steps:
      - name: What to build
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          PR: ${{ github.event.pull_request.number || inputs.pr_number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -z "$PR" ]; then
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::Only main is built without a pull request. Run this from main, or give pr_number."
              exit 1
            fi
            ref=$GITHUB_SHA
            tag=autobuild-$GITHUB_SHA
            prerelease=false
          else
            if [ "$EVENT" = pull_request ]; then
              # A preview build publishes a release: only for people who could push one themselves.
              permission=$(gh api "repos/$GH_REPO/collaborators/$ACTOR/permission" --jq .permission)
              if [ "$permission" != admin ] && [ "$permission" != write ]; then
                echo "::error::$ACTOR does not have write access. Someone who does can build this pull request by running this workflow with pr_number."
                exit 1
              fi
              ref=$PR_HEAD
            else
              ref=$(gh api "repos/$GH_REPO/pulls/$PR" --jq .head.sha)
            fi
            tag=autobuild-preview-pr-$PR-${ref:0:8}
            prerelease=true
          fi
          echo "building $ref as $tag"
          {
            echo "ref=$ref"
            echo "tag=$tag"
            echo "prerelease=$prerelease"
            echo "pr=$PR"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ steps.target.outputs.ref }}
          sparse-checkout: .github/scripts
      - name: Lanes
        id: lanes
        run: |
          set -euo pipefail
          node .github/scripts/plan.mjs
          node .github/scripts/plan.mjs --outputs >> "$GITHUB_OUTPUT"

  # The release exists, as a draft, before any build finishes: each build job uploads its tarball straight onto it
  # and the `release` job publishes it once every asset is there (or deletes it if anything failed). A draft has no
  # tag and is invisible to anyone without push access, so a half-built release is never downloadable.
  create-release:
    name: Create draft release
    needs: plan
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - name: Create draft release
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          TARGET: ${{ needs.plan.outputs.ref }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          set -euo pipefail
          # A release for this tag can exist from an earlier run. Published (this is a re-run of a run that succeeded):
          # keep it, the build jobs overwrite its assets. Draft (a run that was cancelled before it could clean up, or
          # a run against the same tag still in flight): replace it, so that nothing stale is published under this run.
          if existing=$(gh release view "$TAG" --json databaseId,isDraft 2>/dev/null); then
            id=$(jq -r .databaseId <<< "$existing")
            if [ "$(jq -r .isDraft <<< "$existing")" = false ]; then
              echo "release $TAG is already published (id $id), reusing it"
              echo "release_id=$id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "replacing stale draft of $TAG (id $id)"
            gh api -X DELETE "repos/$GH_REPO/releases/$id"
          fi
          # The tag is created when the draft is published, so it is pinned to the built commit here. The API takes a
          # full SHA or a branch, so build_ref (which may be a short SHA or a tag) is resolved first.
          target=$(gh api "repos/$GH_REPO/commits/$TARGET" --jq .sha)
          created=$(gh api -X POST "repos/$GH_REPO/releases" \
            -f tag_name="$TAG" -f name="$TAG" -f target_commitish="$target" \
            -F draft=true -F prerelease="$PRERELEASE" -F generate_release_notes=true \
            --jq '"\(.id) \(.html_url)"')
          echo "created draft $created"
          echo "release_id=${created%% *}" >> "$GITHUB_OUTPUT"

  # `build` and `build-tested` are one job in two halves: the same steps, over the lanes `test` does not wait for and
  # the lanes it does. `needs:` names a job, never one leg of its matrix, so the lanes that are tested have to be a job
  # of their own for `test` to start when they are done rather than when all 42 are.
  build:
    name: ${{ matrix.label }}
    needs: plan
    permissions: &build_permissions
      contents: write
    runs-on: ${{ matrix.runner }}
    strategy:
      # One lane's failure shouldn't cancel the others.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build) }}
    timeout-minutes: 90
    steps: &build_steps
      # windows-native only. No scoop: `irm get.scoop.sh | iex` installs nothing since ScoopInstaller/Install@a6210927
      # (the installer skips Install-Scoop when $MyInvocation.InvocationName is '.', and the runner's pwsh shell
      # dot-sources every `run:` script). Nothing needed it anyway: cmake and ninja come from the Visual Studio
      # install, see the PATH reorder in windows-release.ps1.
      - name: Install LLVM (ARM64)
        if: matrix.platform == 'windows-native' && matrix.package_cpu == 'arm64'
        shell: pwsh
        run: |
          # Install LLVM ARM64 from official LLVM releases
          # Use LLVM 21 for ARM64 - has better Windows ARM64 support and fixes SEH unwind bugs
          $llvmVersion = "21.1.8"
          $llvmUrl = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$llvmVersion/LLVM-$llvmVersion-woa64.exe"
          $llvmPath = "C:\LLVM"
          Invoke-WebRequest -Uri $llvmUrl -OutFile "$env:TEMP\llvm-arm64.exe"
          & "C:\Program Files\7-Zip\7z.exe" x "$env:TEMP\llvm-arm64.exe" -o"$llvmPath" -y
          "$llvmPath\bin" >> $Env:GITHUB_PATH
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !LayoutTests/
            !JSTests/
      - uses: docker/setup-buildx-action@885d1462b80bc1c1c7f0b00334ad271f09369c55 # v2.10.0
        if: matrix.platform != 'windows-native'
        id: buildx
        with:
          install: true
      # Every lane but windows-native: the lane's release script builds into $temp/bun-webkit inside Docker, and that
      # is packaged as bun-webkit.tar.gz.
      - name: Build
        if: matrix.platform != 'windows-native'
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
          SCRIPT: ${{ matrix.script }}
          # What the release script takes (WEBKIT_RELEASE_TYPE, LTO_FLAG, MARCH_FLAG, MACOS_ARCH, ...), as a JSON object.
          SCRIPT_ENV: ${{ toJSON(matrix.env) }}
          PACKAGE_OS: ${{ matrix.package_os }}
          PACKAGE_CPU: ${{ matrix.package_cpu }}
          BUILD_REF: ${{ needs.plan.outputs.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/bun-webkit" "$RUNNER_TEMP/bun-webkit.tar.gz"
          exports=$(jq -r 'to_entries[] | "export \(.key)=\(.value | @sh)"' <<< "$SCRIPT_ENV")
          eval "$exports"
          temp="$RUNNER_TEMP" bash "$SCRIPT"
          cd "$RUNNER_TEMP"
          echo "#define BUN_WEBKIT_VERSION \"$BUILD_REF\"" >> bun-webkit/include/cmakeconfig.h
          echo "{ \"name\": \"$LABEL\", \"version\": \"0.0.1-$BUILD_REF\", \"os\": [\"$PACKAGE_OS\"], \"cpu\": [\"$PACKAGE_CPU\"], \"repository\": \"https://github.com/$REPOSITORY\" }" > bun-webkit/package.json
          rm -rf bun-webkit/lib/*.so bun-webkit/lib/*.so.*
          tar -czf bun-webkit.tar.gz bun-webkit
          rm -rf bun-webkit
      # windows-native: windows-release.ps1 builds and packages ./bun-webkit.tar.gz itself.
      - name: Build (on Windows)
        if: matrix.platform == 'windows-native'
        shell: pwsh
        run: |
          $platform = if ("${{ matrix.package_cpu }}" -eq "arm64") { "ARM64" } else { "x64" }
          if ($platform -eq "ARM64") {
            $env:Path = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\arm64\;" + $env:Path
          } else {
            $env:Path = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\;" + $env:Path
          }
          $env:WEBKIT_OUTPUT_DIR = "bun-webkit"
          $env:BUN_WEBKIT_VERSION = "${{ needs.plan.outputs.ref }}"
          $env:CMAKE_BUILD_TYPE = "${{ matrix.build_type }}"
          $env:PACKAGE_JSON_LABEL = "${{ matrix.label }}"
          $env:GITHUB_SHA = "${{ needs.plan.outputs.ref }}"
          $env:PACKAGE_JSON_ARCH = "${{ matrix.package_cpu }}"
          $env:GITHUB_REPOSITORY = "${{ github.repository }}"
          ./windows-release.ps1 -Platform $platform
      - name: Upload release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          LABEL: ${{ matrix.label }}
          DIR: ${{ matrix.platform == 'windows-native' && '.' || runner.temp }}
        run: |
          set -euo pipefail
          mv "$DIR/bun-webkit.tar.gz" "$DIR/$LABEL.tar.gz"
          # create-release runs alongside this job and is normally long done; wait for it rather than fail.
          for i in $(seq 1 60); do gh release view "$TAG" >/dev/null 2>&1 && break; sleep 10; done
          gh release view "$TAG" >/dev/null 2>&1 || { echo "::error::no release for $TAG. After a failed run use 'Re-run all jobs' so that create-release runs again."; exit 1; }
          for attempt in 1 2 3 4 5; do
            gh release upload "$TAG" "$DIR/$LABEL.tar.gz" --clobber && { echo "uploaded $LABEL"; exit 0; }
            echo "upload of $LABEL failed (attempt $attempt)"; sleep $((attempt * 10))
          done
          exit 1

  build-tested:
    name: ${{ matrix.label }}
    needs: plan
    permissions: *build_permissions
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build_tested) }}
    timeout-minutes: 90
    steps: *build_steps

  # JavaScriptCore's own test suites (JSTests/, LayoutTests/js, the PerformanceTests collections), run by
  # Tools/Scripts/run-javascriptcore-tests with the jsc shell that a tested lane ships in its tarball's bin/, on the
  # runner that built it. Which lanes are tested, and why those, is in plan.mjs.
  #
  # `release` does not wait for this job, so a test failure never holds back or deletes a release: the run goes red,
  # the release is still published. --no-fail-fast below means every test runs and every failure is reported before
  # the job fails.
  test:
    name: Test ${{ matrix.label }}
    needs:
      - plan
      - build-tested
    # Reading the assets of a draft release takes push access.
    permissions:
      contents: write
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.test) }}
    timeout-minutes: 90
    steps:
      # The tests live in JSTests/, LayoutTests/js + fast/regex (LayoutTests/jsc-layout-tests.yaml) and PerformanceTests/.
      # The rest of LayoutTests/ is several GB that nothing here reads.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/LayoutTests/*
            /LayoutTests/jsc-layout-tests.yaml
            /LayoutTests/resources/
            /LayoutTests/js/
            /LayoutTests/fast/regex/
      - name: Install what the test runner needs
        run: |
          set -euo pipefail
          missing=()
          for tool in perl ruby python3 make jq; do command -v "$tool" >/dev/null || missing+=("$tool"); done
          if [ ${#missing[@]} -gt 0 ]; then
            sudo apt-get update
            sudo apt-get install -y "${missing[@]}"
          fi
      - name: Download the jsc shell
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          LABEL: ${{ matrix.label }}
          DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          # The tarball was uploaded to the (still draft) release by `build-tested`. If another build job failed,
          # `release` may already have deleted the draft; there is nothing to test then.
          for attempt in 1 2 3 4 5; do
            gh release download "$TAG" --pattern "$LABEL.tar.gz" --dir "$DIR" --clobber && break
            [ "$attempt" = 5 ] && { echo "::error::could not download $LABEL.tar.gz from $TAG"; exit 1; }
            echo "download of $LABEL failed (attempt $attempt)"; sleep $((attempt * 10))
          done
          # Only bin/ is needed; the static libraries are most of the tarball.
          tar -xzf "$DIR/$LABEL.tar.gz" -C "$DIR" bun-webkit/bin
          rm "$DIR/$LABEL.tar.gz"
          ls -la "$DIR/bun-webkit/bin"
      - name: testFFI
        env: &test_env
          # detect_leaks=0: LeakSanitizer reports the shell's deliberate exit-time leaks and turns every exit code into 1.
          # allocator_may_return_null=1: tests that provoke out-of-memory expect a JS exception, not an ASAN abort.
          ASAN_OPTIONS: detect_leaks=0:allocator_may_return_null=1
          UBSAN_OPTIONS: print_stacktrace=1
          # The jsc shell aborts when its footprint passes this. --memory-limited defaults it to 600MB, which ASAN's
          # overhead (shadow, redzones, quarantine) takes ordinary tests past.
          JSCTEST_memoryLimit: 4294967296
        run: ${{ runner.temp }}/bun-webkit/bin/testFFI
      - name: run-javascriptcore-tests
        env: *test_env
        run: |
          set -uo pipefail
          echo "$(nproc) cores, $(free -g | awk '/^Mem:/ {print $2}')GB of memory"
          # --root: <root>/bin/jsc. The C++ test binaries (testapi, testmasm, testb3, testair, testdfg) are not built
          # by the release Dockerfiles, hence the --no-test*.
          # --memory-limited: what upstream's Linux bots pass; skips the tests marked as needing a lot of memory.
          # --no-fail-fast: run everything, report every failure.
          perl Tools/Scripts/run-javascriptcore-tests \
            --no-build --root="$RUNNER_TEMP/bun-webkit" --release --jsc-only \
            --no-testmasm --no-testair --no-testb3 --no-testdfg --no-testapi --no-testwasmdebugger \
            --no-fail-fast --memory-limited \
            --json-output="$RUNNER_TEMP/jsc-results.json" 2>&1 | tee "$RUNNER_TEMP/jsc-tests.log" | grep -v '^Skipping '
          status=${PIPESTATUS[0]}
          echo "run-javascriptcore-tests exited with $status"
          exit "$status"
      - name: Summary
        if: always()
        env:
          LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          results="$RUNNER_TEMP/jsc-results.json"
          [ -f "$results" ] || { echo "no results file"; exit 0; }
          {
            echo "### JavaScriptCore tests: $LABEL"
            echo
            echo "$(jq '.stressTestFailures | length' "$results") failing runs, in $(jq '[.stressTestFailures[] | sub("\\.js\\..*$"; ".js")] | unique | length' "$results") test files."
            echo
            echo "<details><summary>Failing test files</summary>"
            echo
            echo '```'
            jq -r '[.stressTestFailures[] | sub("\\.js\\..*$"; ".js")] | group_by(.) | .[] | "\(length)\t\(.[0])"' "$results"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jsc-test-results-${{ matrix.label }}
          path: |
            ${{ runner.temp }}/jsc-results.json
            ${{ runner.temp }}/jsc-tests.log
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: release
    # Runs whatever happened to the builds (also when the run was cancelled), so the draft never outlives the run: it
    # is published when every build job succeeded and every listed asset is on it, and deleted otherwise.
    if: always() && needs.plan.result == 'success'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - plan
      - create-release
      - build
      - build-tested
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      # Every lane uploads <label>.tar.gz. The lanes are the release: a label missing from it fails the job.
      - name: Publish or delete the draft
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          NEEDS: ${{ toJSON(needs) }}
          LABELS: ${{ needs.plan.outputs.labels }}
        run: |
          set -euo pipefail
          ok=true
          failed=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<< "$NEEDS")
          if [ -n "$failed" ]; then
            echo "jobs that did not succeed:"; echo "$failed"; ok=false
          else
            jq -r '.[]' <<< "$LABELS" | sort > expected.txt
            gh api "repos/$GH_REPO/releases/$RELEASE_ID" --jq '.assets[].name' | sed 's/\.tar\.gz$//' | sort > uploaded.txt
            missing=$(comm -23 expected.txt uploaded.txt)
            if [ -n "$missing" ]; then
              echo "assets missing from $TAG:"; echo "$missing"; ok=false
            fi
          fi
          if [ "$ok" = true ]; then
            url=$(gh api -X PATCH "repos/$GH_REPO/releases/$RELEASE_ID" -F draft=false --jq .html_url)
            echo "published $TAG with $(wc -l < uploaded.txt) assets: $url"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Only the draft this run created is deleted: not a published release (a re-run of a run that succeeded),
          # and not a draft that a newer run for the same tag has replaced.
          if [ -n "$RELEASE_ID" ] && [ "$(gh api "repos/$GH_REPO/releases/$RELEASE_ID" --jq .draft 2>/dev/null || echo missing)" = true ]; then
            gh api -X DELETE "repos/$GH_REPO/releases/$RELEASE_ID"
            echo "deleted draft $TAG (id $RELEASE_ID)"
          fi
          exit 1

  # Pull requests: link the published release from a comment, one row per commit that was built.
  comment:
    name: Comment on the pull request
    needs:
      - plan
      - release
    if: needs.plan.outputs.pr != '' && needs.release.result == 'success'
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Update preview build comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const marker = '<!-- preview-build-comment -->';
            const prNumber = ${{ needs.plan.outputs.pr }};
            const releaseTag = '${{ needs.plan.outputs.tag }}';
            const sha = '${{ needs.plan.outputs.ref }}';
            const shortSha = sha.substring(0, 8);
            const releaseUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/tag/${releaseTag}`;
            const newEntry = `| \`${shortSha}\` | [\`${releaseTag}\`](${releaseUrl}) | ${new Date().toISOString().replace('T', ' ').substring(0, 19)} UTC |`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100
            });
            const existing = comments.find(c => c.body.includes(marker));

            // Build table
            let previousRows = '';
            if (existing) {
              const lines = existing.body.split('\n');
              const tableLines = lines.filter(l => l.startsWith('| `'));
              previousRows = tableLines.length > 0 ? '\n' + tableLines.join('\n') : '';
            }

            const body = [
              marker,
              '## Preview Builds',
              '',
              '| Commit | Release | Date |',
              '|--------|---------|------|',
              newEntry + previousRows
            ].join('\n');

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body
              });
            }
