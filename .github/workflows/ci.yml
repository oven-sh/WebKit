name: CI

# Builds every lane of bun-webkit, publishes them as one GitHub release, and tests the lanes that are marked as tested.
# A push to main and a pull request run exactly the same jobs; they differ in the commit that is built (env.REF), in
# the name of the release (the `plan` job's `tag`), and in that a pull request gets a comment linking its release.
#
#   plan ──> create-release
#        ──> image ──> build, build-tested ──> release
#                                  └────────> test
#        ──> prune (main only)
#
# A lane is one <label>.tar.gz on the release. The lanes (which runner, which Dockerfile, which settings, tested or not)
# are defined in .github/scripts/lanes.mjs and nowhere else. `plan` turns them into the matrices of the jobs below, and
# `lanes.mjs build <label>` is how a lane is built, here and by hand.
#
# A lane is built by a Dockerfile: a `base` stage that is the toolchain (compilers, SDKs, sysroots; the same for every
# lane of a platform and architecture) and stages on top that build ICU and WebKit with the lane's settings. The
# toolchains are images in ghcr.io, tagged with a hash of what goes into them. `plan` looks which are there; `image`
# builds the ones that are not, which is only after a change to a Dockerfile's `base` stage (otherwise it is skipped),
# and the lanes start from them.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  packages: read

concurrency:
  # A newer commit on a pull request replaces the build of the older one. Other builds never cancel each other.
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The commit that is built. For a pull request that is its head, not the merge commit.
  REF: ${{ github.event.pull_request.head.sha || github.sha }}
  PR: ${{ github.event.pull_request.number }}

jobs:
  plan:
    name: Plan
    # Not for a pull request from a fork: its token cannot publish anything, so all it would do is occupy every large
    # runner for an hour and fail at the upload. Everything below needs this job, so nothing else runs either. Push the
    # branch to this repository to build it.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # The release the lanes are published as.
      tag: ${{ steps.plan.outputs.tag }}
      # Matrices ({"include": [lane, ...]}) of the lanes that are only built, of the lanes that are also tested, and
      # of the test job; and the labels of all lanes.
      build: ${{ steps.plan.outputs.build }}
      build_tested: ${{ steps.plan.outputs.build_tested }}
      test: ${{ steps.plan.outputs.test }}
      labels: ${{ steps.plan.outputs.labels }}
      # Matrix of the toolchain images those lanes start from that are not in the registry yet, and whether there are
      # any. Normally there are none: an image is only missing after a change to a Dockerfile's `base` stage.
      images: ${{ steps.plan.outputs.images }}
      build_images: ${{ steps.plan.outputs.build_images }}
      # The tags of all of them.
      image_tags: ${{ steps.plan.outputs.image_tags }}
    steps:
      # The files at the root (the Dockerfiles among them) come with any sparse checkout.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.REF }}
          sparse-checkout: |
            .github/scripts
            macos-cross
      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if [ -n "$PR" ]; then tag=autobuild-preview-pr-$PR-${REF:0:8}; else tag=autobuild-$REF; fi
          echo "building $REF as $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          node .github/scripts/lanes.mjs
          node .github/scripts/lanes.mjs plan >> "$GITHUB_OUTPUT"

  # The release exists, as a draft, before any build finishes: each build job uploads its tarball straight onto it
  # and the `release` job publishes it once every asset is there (or deletes it if anything failed). A draft has no
  # tag and is invisible to anyone without push access, so a half-built release is never downloadable.
  create-release:
    name: Create draft release
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - name: Create draft release
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          TARGET: ${{ env.REF }}
          PRERELEASE: ${{ github.ref != 'refs/heads/main' }}
        run: |
          set -euo pipefail
          # A release for this tag can exist from an earlier run. Published (this is a re-run of a run that succeeded):
          # keep it, the build jobs overwrite its assets. Draft (a run that was cancelled before it could clean up, or
          # a run against the same tag still in flight): replace it, so that nothing stale is published under this run.
          if existing=$(gh release view "$TAG" --json databaseId,isDraft 2>/dev/null); then
            id=$(jq -r .databaseId <<< "$existing")
            if [ "$(jq -r .isDraft <<< "$existing")" = false ]; then
              echo "release $TAG is already published (id $id), reusing it"
              echo "release_id=$id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "replacing stale draft of $TAG (id $id)"
            gh api -X DELETE "repos/$GH_REPO/releases/$id"
          fi
          # The tag is created when the draft is published, so it is pinned to the built commit here. The API takes a
          # full SHA or a branch, so build_ref (which may be a short SHA or a tag) is resolved first.
          target=$(gh api "repos/$GH_REPO/commits/$TARGET" --jq .sha)
          created=$(gh api -X POST "repos/$GH_REPO/releases" \
            -f tag_name="$TAG" -f name="$TAG" -f target_commitish="$target" \
            -F draft=true -F prerelease="$PRERELEASE" -F generate_release_notes=true \
            --jq '"\(.id) \(.html_url)"')
          echo "created draft $created"
          echo "release_id=${created%% *}" >> "$GITHUB_OUTPUT"

  # Builds the toolchain images `plan` found missing from ghcr.io, which is only after a change to a Dockerfile's `base`
  # stage: on any other run this job is skipped and the lanes start right away. Pushing takes `packages: write`. The
  # lanes need these images: a leg that cannot build or push its image fails, and no lane starts.
  image:
    name: image ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.build_images == 'true'
    permissions:
      contents: read
      packages: write
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.images) }}
    timeout-minutes: 60
    steps:
      # A standard runner has little free disk, and a toolchain image is several GB of layers.
      - name: Make room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.REF }}
          sparse-checkout: |
            .github/scripts
            macos-cross
      - uses: docker/setup-buildx-action@885d1462b80bc1c1c7f0b00334ad271f09369c55 # v2.10.0
        with:
          install: true
      - name: Build and push
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          node .github/scripts/lanes.mjs image "$NAME" --push

  # Old toolchain images go away, but not at once. A build of main deletes the images main's lanes do not use that are
  # more than KEEP_DAYS old: superseded ones, and ones a pull request built that never landed. One a pull request built
  # recently stays, so a change to a toolchain can be iterated on before it is merged. If an image a branch still wants
  # has been deleted, `plan` finds it missing on that branch's next run and `image` builds it again.
  prune:
    name: Prune toolchain images
    needs: plan
    if: github.ref == 'refs/heads/main'
    permissions:
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete what main does not use and is old
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: /orgs/${{ github.repository_owner }}/packages/container/bun-webkit-build-env
          KEEP: ${{ needs.plan.outputs.image_tags }}
          KEEP_DAYS: 14
        run: |
          set -euo pipefail
          gh api --paginate "$PACKAGE/versions?per_page=100" |
            jq -r --argjson keep "$KEEP" --argjson days "$KEEP_DAYS" '
              .[]
              | .metadata.container.tags as $tags
              | select(any($tags[]; . as $tag | $keep | index($tag)) | not)
              | select(now - (.updated_at | fromdateiso8601) > $days * 86400)
              | "\(.id)\t\(.updated_at)\t\($tags | join(","))"' > delete.tsv
          echo "keeping: $(jq -r 'join(" ")' <<< "$KEEP"), and anything less than $KEEP_DAYS days old"
          while IFS=$'\t' read -r id updated tags; do
            echo "deleting $id (${tags:-untagged}, pushed $updated)"
            gh api -X DELETE "$PACKAGE/versions/$id" || echo "::warning::could not delete package version $id"
          done < delete.tsv

  # `build` and `build-tested` are one job in two halves: the same steps, over the lanes `test` does not wait for and
  # the lanes it does. `needs:` names a job, never one leg of its matrix, so the lanes that are tested have to be a job
  # of their own for `test` to start when they are done rather than when all 42 are.
  build:
    name: ${{ matrix.label }}
    needs: &build_needs
      - plan
      - image
    # `image` is skipped when there was nothing for it to build.
    if: &images_are_there ${{ !cancelled() && needs.plan.result == 'success' && (needs.image.result == 'success' || needs.image.result == 'skipped') }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # One lane's failure shouldn't cancel the others.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build) }}
    timeout-minutes: 90
    steps: &build_steps
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.REF }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !LayoutTests/
            !JSTests/
      - uses: docker/setup-buildx-action@885d1462b80bc1c1c7f0b00334ad271f09369c55 # v2.10.0
        id: buildx
        with:
          install: true
      # The lane is built into bun-webkit/ inside Docker, and that is packaged as bun-webkit.tar.gz.
      - name: Build
        env:
          LABEL: ${{ matrix.label }}
          PACKAGE_OS: ${{ matrix.package_os }}
          PACKAGE_CPU: ${{ matrix.package_cpu }}
          BUILD_REF: ${{ env.REF }}
          REPOSITORY: ${{ github.repository }}
          IMAGE: ${{ matrix.image }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/bun-webkit" "$RUNNER_TEMP/bun-webkit.tar.gz"
          # Starting from the lane's toolchain image, which is in the registry: `plan` found it there or `image` put it.
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          node .github/scripts/lanes.mjs build "$LABEL" --output "$RUNNER_TEMP/bun-webkit" --base-image "$IMAGE"
          cd "$RUNNER_TEMP"
          echo "#define BUN_WEBKIT_VERSION \"$BUILD_REF\"" >> bun-webkit/include/cmakeconfig.h
          echo "{ \"name\": \"$LABEL\", \"version\": \"0.0.1-$BUILD_REF\", \"os\": [\"$PACKAGE_OS\"], \"cpu\": [\"$PACKAGE_CPU\"], \"repository\": \"https://github.com/$REPOSITORY\" }" > bun-webkit/package.json
          rm -rf bun-webkit/lib/*.so bun-webkit/lib/*.so.*
          tar -czf bun-webkit.tar.gz bun-webkit
          rm -rf bun-webkit
      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          LABEL: ${{ matrix.label }}
          DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          mv "$DIR/bun-webkit.tar.gz" "$DIR/$LABEL.tar.gz"
          # create-release runs alongside this job and is normally long done; wait for it rather than fail.
          for i in $(seq 1 60); do gh release view "$TAG" >/dev/null 2>&1 && break; sleep 10; done
          gh release view "$TAG" >/dev/null 2>&1 || { echo "::error::no release for $TAG. After a failed run use 'Re-run all jobs' so that create-release runs again."; exit 1; }
          for attempt in 1 2 3 4 5; do
            gh release upload "$TAG" "$DIR/$LABEL.tar.gz" --clobber && { echo "uploaded $LABEL"; exit 0; }
            echo "upload of $LABEL failed (attempt $attempt)"; sleep $((attempt * 10))
          done
          exit 1

  build-tested:
    name: ${{ matrix.label }}
    needs: *build_needs
    if: *images_are_there
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build_tested) }}
    timeout-minutes: 90
    steps: *build_steps

  # JavaScriptCore's own test suites (JSTests/, LayoutTests/js, the PerformanceTests collections), run by
  # Tools/Scripts/run-javascriptcore-tests with the jsc shell that a tested lane ships in its tarball's bin/, on a
  # runner of the architecture it was built for. Which lanes are tested, and why those, is in lanes.mjs.
  #
  # `release` does not wait for this job, so a test failure never holds back or deletes a release: the run goes red,
  # the release is still published. --no-fail-fast below means every test runs and every failure is reported before
  # the job fails.
  test:
    name: Test ${{ matrix.label }}
    needs:
      - plan
      - build-tested
    # Also when one of the tested lanes failed to build: the ones that did build are still tested, and the leg of the
    # one that did not fails at its download. Not when they were never built.
    if: ${{ !cancelled() && (needs.build-tested.result == 'success' || needs.build-tested.result == 'failure') }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.test) }}
    timeout-minutes: 90
    steps:
      # The tests live in JSTests/, PerformanceTests/ and a few corners of LayoutTests/: js + fast/regex
      # (LayoutTests/jsc-layout-tests.yaml) and the web-platform-tests for wasm with their harness (JSTests/wasm.yaml).
      # The rest of LayoutTests/ is several GB that nothing here reads. A collection that points somewhere that is
      # not checked out fails run-jsc-stress-tests at once, in `realpath`.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.REF }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/LayoutTests/*
            /LayoutTests/jsc-layout-tests.yaml
            /LayoutTests/resources/
            /LayoutTests/js/
            /LayoutTests/fast/regex/
            /LayoutTests/imported/w3c/web-platform-tests/wasm/
            /LayoutTests/imported/w3c/web-platform-tests/resources/
      - name: Install what the test runner needs
        run: |
          set -euo pipefail
          missing=()
          for tool in perl ruby python3 make jq; do command -v "$tool" >/dev/null || missing+=("$tool"); done
          if [ ${#missing[@]} -gt 0 ]; then
            sudo apt-get update
            sudo apt-get install -y "${missing[@]}"
          fi
      - name: Download the jsc shell
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          LABEL: ${{ matrix.label }}
          DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          # The tarball was uploaded to the (still draft) release by `build-tested`. If another build job failed,
          # `release` may already have deleted the draft; there is nothing to test then.
          for attempt in 1 2 3 4 5; do
            gh release download "$TAG" --pattern "$LABEL.tar.gz" --dir "$DIR" --clobber && break
            [ "$attempt" = 5 ] && { echo "::error::could not download $LABEL.tar.gz from $TAG"; exit 1; }
            echo "download of $LABEL failed (attempt $attempt)"; sleep $((attempt * 10))
          done
          # Only bin/ is needed; the static libraries are most of the tarball.
          tar -xzf "$DIR/$LABEL.tar.gz" -C "$DIR" bun-webkit/bin
          rm "$DIR/$LABEL.tar.gz"
          ls -la "$DIR/bun-webkit/bin"
      # testFFI and the JavaScriptCore tests each run whatever the other did, and either failing fails the job.
      - name: testFFI
        if: &have_jsc ${{ !cancelled() && steps.download.outcome == 'success' }}
        env: &test_env
          # detect_leaks=0: LeakSanitizer reports the shell's deliberate exit-time leaks and turns every exit code into 1.
          # allocator_may_return_null=1: tests that provoke out-of-memory expect a JS exception, not an ASAN abort.
          ASAN_OPTIONS: detect_leaks=0:allocator_may_return_null=1
          UBSAN_OPTIONS: print_stacktrace=1
          # The jsc shell aborts when its footprint passes this. --memory-limited defaults it to 600MB, which ASAN's
          # overhead (shadow, redzones, quarantine) takes ordinary tests past.
          JSCTEST_memoryLimit: 4294967296
        run: ${{ runner.temp }}/bun-webkit/bin/testFFI
      - name: run-javascriptcore-tests
        if: *have_jsc
        env: *test_env
        run: |
          set -uo pipefail
          echo "$(nproc) cores, $(free -g | awk '/^Mem:/ {print $2}')GB of memory"
          # --root: <root>/bin/jsc. The C++ test binaries (testapi, testmasm, testb3, testair, testdfg) are not built
          # by the release Dockerfiles, hence the --no-test*.
          # --memory-limited: what upstream's Linux bots pass; skips the tests marked as needing a lot of memory.
          # --no-fail-fast: run everything, report every failure.
          perl Tools/Scripts/run-javascriptcore-tests \
            --no-build --root="$RUNNER_TEMP/bun-webkit" --release --jsc-only \
            --no-testmasm --no-testair --no-testb3 --no-testdfg --no-testapi --no-testwasmdebugger \
            --no-fail-fast --memory-limited \
            --json-output="$RUNNER_TEMP/jsc-results.json" 2>&1 | tee "$RUNNER_TEMP/jsc-tests.log" | grep -v '^Skipping [^ ]*$'
          status=${PIPESTATUS[0]}
          echo "run-javascriptcore-tests exited with $status"
          exit "$status"
      - name: Summary
        if: always()
        env:
          LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          results="$RUNNER_TEMP/jsc-results.json"
          [ -f "$results" ] || { echo "no results file"; exit 0; }
          {
            echo "### JavaScriptCore tests: $LABEL"
            echo
            echo "$(jq '.stressTestFailures | length' "$results") failing runs, in $(jq '[.stressTestFailures[] | sub("\\.js\\..*$"; ".js")] | unique | length' "$results") test files."
            echo
            echo "<details><summary>Failing test files</summary>"
            echo
            echo '```'
            jq -r '[.stressTestFailures[] | sub("\\.js\\..*$"; ".js")] | group_by(.) | .[] | "\(length)\t\(.[0])"' "$results"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jsc-test-results-${{ matrix.label }}
          path: |
            ${{ runner.temp }}/jsc-results.json
            ${{ runner.temp }}/jsc-tests.log
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: release
    # Runs whatever happened to the builds (also when the run was cancelled), so the draft never outlives the run: it
    # is published when every build job succeeded and every listed asset is on it, and deleted otherwise.
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - plan
      - create-release
      - build
      - build-tested
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      # Every lane uploads <label>.tar.gz. The lanes are the release: a label missing from it fails the job.
      - name: Publish or delete the draft
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          NEEDS: ${{ toJSON(needs) }}
          LABELS: ${{ needs.plan.outputs.labels }}
        run: |
          set -euo pipefail
          ok=true
          failed=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<< "$NEEDS")
          if [ -n "$failed" ]; then
            echo "jobs that did not succeed:"; echo "$failed"; ok=false
          else
            jq -r '.[]' <<< "$LABELS" | sort > expected.txt
            gh api "repos/$GH_REPO/releases/$RELEASE_ID" --jq '.assets[].name' | sed 's/\.tar\.gz$//' | sort > uploaded.txt
            missing=$(comm -23 expected.txt uploaded.txt)
            if [ -n "$missing" ]; then
              echo "assets missing from $TAG:"; echo "$missing"; ok=false
            fi
          fi
          if [ "$ok" = true ]; then
            url=$(gh api -X PATCH "repos/$GH_REPO/releases/$RELEASE_ID" -F draft=false --jq .html_url)
            echo "published $TAG with $(wc -l < uploaded.txt) assets: $url"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            # A pull request gets a comment linking its release, edited in place by the next build.
            [ -z "$PR" ] || gh pr comment "$PR" --edit-last --create-if-none --body "Preview build of ${REF:0:8}: [\`$TAG\`]($url)" || echo "::warning::could not comment on #$PR"
            exit 0
          fi
          # Only the draft this run created is deleted: not a published release (a re-run of a run that succeeded),
          # and not a draft that a newer run for the same tag has replaced.
          if [ -n "$RELEASE_ID" ] && [ "$(gh api "repos/$GH_REPO/releases/$RELEASE_ID" --jq .draft 2>/dev/null || echo missing)" = true ]; then
            gh api -X DELETE "repos/$GH_REPO/releases/$RELEASE_ID"
            echo "deleted draft $TAG (id $RELEASE_ID)"
          fi
          exit 1
